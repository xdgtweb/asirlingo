function selectFillWord(wordEl, word, correctWord, bank) {
  const slot = document.getElementById('fill-slot');
  if (!slot || wordEl.classList.contains('used')) return;

  // Animation: Create a flying clone
  const rectFrom = wordEl.getBoundingClientRect();
  const rectTo = slot.getBoundingClientRect();

  const flyer = document.createElement('div');
  flyer.className = 'flying-word';
  flyer.textContent = word;
  flyer.style.left = rectFrom.left + 'px';
  flyer.style.top = rectFrom.top + 'px';
  flyer.style.width = rectFrom.width + 'px';
  flyer.style.height = rectFrom.height + 'px';
  document.body.appendChild(flyer);

  wordEl.classList.add('used');

  // Trigger animation
  requestAnimationFrame(() => {
    flyer.style.left = rectTo.left + 'px';
    flyer.style.top = rectTo.top + 'px';
    flyer.style.width = rectTo.width + 'px';
    flyer.style.height = rectTo.height + 'px';
    flyer.style.opacity = '0.8';
    flyer.style.transform = 'scale(0.95)';
  });

  setTimeout(() => {
    flyer.remove();
    
    if (slot.classList.contains('filled')) {
      const oldWord = slot.textContent;
      bank.querySelectorAll('.fill-word.used').forEach(w => {
        if (w.dataset.word === oldWord) w.classList.remove('used');
      });
    }

    slot.textContent = word;
    slot.classList.add('filled');

    selectedAnswer = { type: 'fill', word, correctWord, slot, bank };
    
    const continueBtn = document.getElementById('btn-continue');
    continueBtn.style.display = 'block';
    continueBtn.textContent = 'Comprobar';
    continueBtn.classList.remove('wrong');
    pendingAction = 'check';
  }, 450);
}

// ---- Match Pairs ----
let matchSelected = null;
let matchedCount = 0;
let matchTotal = 0;

function renderMatch(q, body) {
  const container = document.createElement('div');
  container.className = 'match-container';

  const grid = document.createElement('div');
  grid.className = 'match-grid';
  grid.id = 'match-grid';

  const leftItems = q.pairs.map((p, i) => ({ text: p.a, pairId: i, side: 'left' }));
  const rightItems = q.pairs.map((p, i) => ({ text: p.b, pairId: i, side: 'right' }));

  matchTotal = q.pairs.length;
  matchedCount = 0;
  matchSelected = null;

  const shuffledLeft = shuffleArray(leftItems);
  const shuffledRight = shuffleArray(rightItems);

  // Left column
  shuffledLeft.forEach(item => {
    const el = document.createElement('div');
    el.className = 'match-item';
    el.textContent = item.text;
    el.dataset.pairId = item.pairId;
    el.dataset.side = 'left';
    el.onclick = () => selectMatch(el);
    grid.appendChild(el);
  });

  // Right column
  shuffledRight.forEach(item => {
    const el = document.createElement('div');
    el.className = 'match-item';
    el.textContent = item.text;
    el.dataset.pairId = item.pairId;
    el.dataset.side = 'right';
    el.onclick = () => selectMatch(el);
    grid.appendChild(el);
  });

  container.appendChild(grid);
  body.appendChild(container);
}

function selectMatch(el) {
  if (el.classList.contains('matched') || el.classList.contains('disabled')) return;

  if (!matchSelected) {
    matchSelected = el;
    el.classList.add('selected');
  } else {
    // Check if same side
    if (matchSelected.dataset.side === el.dataset.side) {
      matchSelected.classList.remove('selected');
      matchSelected = el;
      el.classList.add('selected');
      return;
    }

    // Check match
    if (matchSelected.dataset.pairId === el.dataset.pairId) {
      matchSelected.classList.remove('selected');
      matchSelected.classList.add('matched');
      el.classList.add('matched');
      matchedCount++;
      matchSelected = null;

      if (matchedCount === matchTotal) {
        setTimeout(() => handleCorrect(), 300);
      }
    } else {
      const wrong1 = matchSelected;
      const wrong2 = el;
      wrong1.classList.remove('selected');
      wrong1.classList.add('wrong');
      wrong2.classList.add('wrong');
      setTimeout(() => {
        wrong1.classList.remove('wrong');
        wrong2.classList.remove('wrong');
      }, 600);
      matchSelected = null;
      // Penalty for wrong match
      handleWrong(true); // partial wrong, don't lose heart yet
    }
  }
}

// ---- Helpers for text questions ----
function normalizeAnswer(str) {
  return str.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) =>
    Array.from({ length: n + 1 }, (_, j) => (i === 0 ? j : j === 0 ? i : 0))
  );
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

function fuzzyMatch(userInput, correctAnswer) {
  const a = normalizeAnswer(userInput);
  const candidates = Array.isArray(correctAnswer) ? correctAnswer : [correctAnswer];
  for (const cand of candidates) {
    const b = normalizeAnswer(cand);
    if (a === b) return true;
    const threshold = b.length <= 5 ? 1 : b.length <= 10 ? 2 : 3;
    if (levenshtein(a, b) <= threshold) return true;
    if (b.length > 4 && a.includes(b)) return true;
  }
  return false;
}

// ---- Render text-input question ----
function renderText(q, body) {
  const wrap = document.createElement('div');
  wrap.className = 'text-answer-wrap';

  const input = document.createElement('textarea');
  input.className = 'text-answer-input';
  input.placeholder = 'Escribe tu respuesta aquí…';
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('autocorrect', 'off');
  input.setAttribute('spellcheck', 'false');
  input.rows = 2;

  const hint = document.createElement('div');
  hint.className = 'text-answer-hint';
  hint.textContent = 'Pulsa COMPROBAR cuando estés listo · Enter para enviar';

  const showCorrect = document.createElement('div');
  showCorrect.className = 'text-correct-answer';
  const correctDisplay = Array.isArray(q.correct) ? q.correct[0] : q.correct;
  showCorrect.innerHTML = `<strong>Respuesta correcta:</strong> ${correctDisplay}`;

  wrap.appendChild(input);
  wrap.appendChild(hint);
  wrap.appendChild(showCorrect);
  body.appendChild(wrap);

  selectedAnswer = { type: 'text', input, q, showCorrect, submitted: false };

  input.addEventListener('input', () => {
    if (isChecking) return;
    const btn = document.getElementById('btn-continue');
    if (input.value.trim()) {
      btn.style.display = 'block';
      btn.textContent = 'Comprobar';
      btn.classList.remove('wrong');
      pendingAction = 'check';
    } else {
      btn.style.display = 'none';
      pendingAction = null;
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey) {
      e.preventDefault();
      if (input.value.trim() && !isChecking && !selectedAnswer.submitted) {
        checkCurrentAnswer();
      }
    }
  });

  setTimeout(() => input.focus(), 140);
}

function checkCurrentAnswer() {
  if (!selectedAnswer || isChecking) return;
  isChecking = true;

  const { type } = selectedAnswer;

  if (type === 'text') {
    const { input, q, showCorrect } = selectedAnswer;
    selectedAnswer.submitted = true;
    input.disabled = true;
    const isCorrect = fuzzyMatch(input.value, q.correct);
    if (isCorrect) {
      input.classList.add('correct-input');
      handleCorrect();
    } else {
      input.classList.add('wrong-input');
      showCorrect.style.display = 'block';
      handleWrong();
    }
    return;
  }

  if (type === 'mc') {
    const { idx, correctIdx, btn, container } = selectedAnswer;
    container.querySelectorAll('.mc-answer').forEach(b => b.classList.add('disabled'));
    const isCorrect = idx === correctIdx;
    if (isCorrect) {
      btn.classList.remove('selected');
      btn.classList.add('correct');
      handleCorrect();
    } else {
      btn.classList.remove('selected');
      btn.classList.add('incorrect');
      container.querySelectorAll('.mc-answer')[correctIdx].classList.add('correct');
      handleWrong();
    }
  }
  else if (type === 'tf') {
    const { choice, correct, btn, container } = selectedAnswer;
    container.querySelectorAll('.tf-btn').forEach(b => b.style.pointerEvents = 'none');
    const isCorrect = choice === correct;
    if (isCorrect) {
      btn.classList.add('correct');
      handleCorrect();
    } else {
      btn.classList.add('incorrect');
      const otherBtn = container.querySelectorAll('.tf-btn')[choice ? 1 : 0];
      otherBtn.classList.add('correct');
      handleWrong();
    }
  }
  else if (type === 'fill') {
    const { word, correctWord, slot, bank } = selectedAnswer;
    bank.querySelectorAll('.fill-word').forEach(w => w.style.pointerEvents = 'none');
    const isCorrect = word === correctWord;
    if (isCorrect) {
      slot.classList.add('correct');
      handleCorrect();
    } else {
      slot.classList.add('incorrect');
      bank.querySelectorAll('.fill-word').forEach(w => {
        if (w.dataset.word === correctWord) {
          w.style.borderColor = 'var(--duo-green)';
          w.style.background = 'rgba(88,204,2,.2)';
        }
      });
      handleWrong();
    }
  }
}

// ---- Answer handlers ----
function handleCorrect() {
  correctCount++;
  comboCount++;
  reactMascot('happy');
  showFeedback(true);
  screenFlash('ok');
  const burst = (lastPointer.x || lastPointer.y) ? { x: lastPointer.x, y: lastPointer.y } : {};
  launchConfetti(Object.assign({ count: 22, power: 0.72, radial: true }, burst));
  floatPop('+10 XP');
  if (comboCount === 3 || comboCount % 5 === 0) {
    floatPop('¡Racha x' + comboCount + '!', { combo: true, color: 'var(--orange-d)' });
  }
  document.getElementById('btn-continue').style.display = 'block';
  document.getElementById('btn-continue').textContent = 'Continuar';
  document.getElementById('btn-continue').classList.remove('wrong');
  pendingAction = 'next';
}

function handleWrong(isMatchPartial) {
  if (!isMatchPartial) {
    // Añadir a la cola de fallos para repetir al final
    const currentQ = currentQuestions[qIndex];
    if (!failedQuestions.includes(currentQ)) {
      failedQuestions.push(currentQ);
    }

    wrongCount++;
    comboCount = 0;
    screenFlash('bad');
    quake(document.getElementById('lesson-body'));
    // Hearts are unlimited: flyHeart and loseHeart disabled
    updateLessonHeader();
    const hearts = document.getElementById('lesson-hearts');
    if (hearts) {
      hearts.classList.remove('shake');
      void hearts.offsetWidth;
      hearts.classList.add('shake');
    }
    // Shake the big lesson mascot too
    const mascotTop = document.getElementById('lesson-mascot-top');
    if (mascotTop) {
      mascotTop.classList.remove('mascot-top-wrong');
      void mascotTop.offsetWidth;
      mascotTop.classList.add('mascot-top-wrong');
    }
  }
  reactMascot('sad');
  showFeedback(false);
  document.getElementById('btn-continue').style.display = 'block';
  document.getElementById('btn-continue').textContent = 'Continuar';
  document.getElementById('btn-continue').classList.add('wrong');
  pendingAction = 'next';
}

function showFeedback(isCorrect) {
  const fb = document.getElementById('lesson-feedback');
  const txt = document.getElementById('lesson-feedback-text');
  fb.classList.add('show');
  
  const q = currentQuestions[qIndex];
  let explanationHtml = '';
  if (!isCorrect && q.explanation) {
    explanationHtml = `<div class="feedback-explanation"><strong>Explicación:</strong> ${q.explanation}</div>`;
  }

  if (isCorrect) {
    fb.classList.add('correct');
    fb.classList.remove('wrong');
    const messages = ['¡Excelente!', '¡Perfecto!', '¡Genial!', '¡Muy bien!', '¡Correcto!'];
    txt.innerHTML = `<div>${messages[Math.floor(Math.random() * messages.length)]}</div>`;
  } else {
    fb.classList.add('wrong');
    fb.classList.remove('correct');
    const messages = ['Casi...', 'Incorrecto', '¡Inténtalo de nuevo!', 'No exactamente...'];
    txt.innerHTML = `<div>${messages[Math.floor(Math.random() * messages.length)]}</div>${explanationHtml}`;
  }
}

document.getElementById('btn-continue').onclick = () => {
  if (pendingAction === 'no-hearts') {
    showScreen('screen-no-hearts');
    return;
  }
  if (pendingAction === 'check') {
    checkCurrentAnswer();
    return;
  }
  qIndex++;
  renderQuestion();
};

// ============================================================
// SALIR DE LA LECCIÓN (modal con el diseño de la app)
// ============================================================
document.getElementById('lesson-close').onclick = () => {
  const done = currentQuestions.length > 0 ? Math.round((qIndex / currentQuestions.length) * 100) : 0;
  openModal({
    mascot: lessonMascotType || 'chip',
    mood: 'sad',
    title: '¿Abandonas la lección?',
    text: `Llevas un ${done}% completado. Si saliste ahora perderás el progreso de esta lección.`,
    cancelText: '¡Seguir adelante!',
    confirmText: 'Salir al menú',
    confirmClass: 'red',
    onConfirm: () => {
      abortLesson();
    }
  });
};

function abortLesson() {
  currentLesson = null;
  currentQuestions = [];
  qIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  showScreen('screen-home');
  renderHome();
}

// ============================================================
// FINISH LESSON
// ============================================================
function finishLesson() {
  const accuracy = currentQuestions.length > 0 ? Math.round((correctCount / currentQuestions.length) * 100) : 0;
  const stars = accuracy >= 90 ? 3 : accuracy >= 60 ? 2 : 1;
  const xpEarned = correctCount * 10 + (stars === 3 ? 20 : 0);

  // Save progress
  const existing = getLessonProgress(currentLesson.id);
  if (!existing.completed || stars > existing.stars) {
    state.progress[currentLesson.id] = { completed: true, stars: Math.max(stars, existing.stars || 0) };
  }

  state.xp += xpEarned;
  updateStreak();
  saveState();

  // Show result
  const resultMascot = document.getElementById('result-mascot');
  resultMascot.innerHTML = mascotSVG(stars === 3 ? 'chip' : stars === 2 ? 'pc' : 'ram', stars >= 2 ? 'happy' : 'idle');
  resultMascot.classList.remove('mascot-happy');
  void resultMascot.offsetWidth;
  resultMascot.classList.add('mascot-happy');
  document.getElementById('result-title').textContent = stars === 3 ? '¡Perfecto!' : stars === 2 ? '¡Bien hecho!' : '¡Completado!';
  document.getElementById('result-subtitle').textContent = `Has ganado ${xpEarned} XP`;
  document.getElementById('result-xp').textContent = '+' + xpEarned;
  document.getElementById('result-accuracy').textContent = accuracy + '%';
  document.getElementById('result-streak').textContent = state.streak;

  const starsContainer = document.getElementById('result-stars');
  starsContainer.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const star = document.createElement('span');
    star.className = 'result-star' + (i < stars ? ' earned' : '');
    star.textContent = '★';
    starsContainer.appendChild(star);
  }

  showScreen('screen-result');

  if (stars >= 2) {
    launchConfetti();
  }
}

document.getElementById('btn-home-result').onclick = () => {
  showScreen('screen-home');
  renderHome();
};

// ============================================================
// NO HEARTS
// ============================================================
document.getElementById('btn-refill').onclick = () => {
  if (state.gems >= 5) {
    state.gems -= 5;
    state.hearts = state.maxHearts;
    state.lastHeartLoss = null;
    saveState();
    showScreen('screen-home');
    renderHome();
  } else {
    alert('No tienes suficientes gemas. ¡Completa lecciones para ganar más!');
  }
};

document.getElementById('btn-back-home').onclick = () => {
  showScreen('screen-home');
  renderHome();
};

document.getElementById('btn-reset-progress').onclick = () => {
  openModal({
    mascot: 'chip',
    mood: 'sad',
    title: '¿Reiniciar progreso?',
    text: 'Se borrarán tus estrellas, XP, gemas y racha. Esto no se puede deshacer.',
    cancelText: 'Cancelar',
    confirmText: 'Reiniciar',
    confirmClass: 'red',
    onConfirm: () => {
      state = {
        hearts: 5, maxHearts: 5, gems: 10, xp: 0, streak: 0,
        lastPlayed: null, progress: {}, expandedUnits: [], lastHeartLoss: null
      };

    }
  });
};

// ============================================================
// MASCOTAS DE HARDWARE (SVG)
// ============================================================
const MASCOT_TYPES = ['pc', 'ram', 'chip', 'server', 'router', 'disk'];
let lessonMascotType = 'pc';

function mascotEyes(cx1, cx2, cy, r, pupil) {
  const r2 = r * 0.52;   // pupil radius
  const r3 = r * 0.18;   // shine radius
  return `<g class="mascot-face face-idle">
    <!-- whites -->
    <circle cx="${cx1}" cy="${cy}" r="${r}" fill="#fff"/>
    <circle cx="${cx2}" cy="${cy}" r="${r}" fill="#fff"/>
    <!-- rim shadow -->
    <circle cx="${cx1}" cy="${cy}" r="${r}" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="1.2"/>
    <circle cx="${cx2}" cy="${cy}" r="${r}" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="1.2"/>
    <!-- pupils (follow cursor via CSS --px/--py) -->
    <circle class="pupil" cx="${cx1}" cy="${cy + 1.5}" r="${r2}" fill="${pupil}"/>
    <circle class="pupil" cx="${cx2}" cy="${cy + 1.5}" r="${r2}" fill="${pupil}"/>
    <!-- inner iris highlight -->
    <circle class="pupil" cx="${cx1 + r * 0.12}" cy="${cy + r * 0.05}" r="${r2 * 0.38}" fill="${pupil}" opacity=".5"/>
    <circle class="pupil" cx="${cx2 + r * 0.12}" cy="${cy + r * 0.05}" r="${r2 * 0.38}" fill="${pupil}" opacity=".5"/>
    <!-- shine -->
    <circle class="pupil" cx="${cx1 - r * 0.28}" cy="${cy - r * 0.22}" r="${r3}" fill="#fff" opacity=".92"/>
    <circle class="pupil" cx="${cx2 - r * 0.28}" cy="${cy - r * 0.22}" r="${r3}" fill="#fff" opacity=".92"/>
    <!-- tiny lower shine -->
    <circle class="pupil" cx="${cx1 + r * 0.2}" cy="${cy + r * 0.32}" r="${r3 * 0.5}" fill="#fff" opacity=".55"/>
    <circle class="pupil" cx="${cx2 + r * 0.2}" cy="${cy + r * 0.32}" r="${r3 * 0.5}" fill="#fff" opacity=".55"/>
  </g>`;
}

function mascotBrows(cx1, cx2, cy, color, mood) {
  if (mood === 'happy') {
    // arched up
    return `<g stroke="${color}" stroke-width="2.8" stroke-linecap="round" fill="none">
      <path d="M${cx1-9} ${cy+1} Q${cx1-1} ${cy-8} ${cx1+8} ${cy+1}"/>
      <path d="M${cx2-8} ${cy+1} Q${cx2+1} ${cy-8} ${cx2+9} ${cy+1}"/>
    </g>`;
  }
  // sad / worried — inner ends dip down
  return `<g stroke="${color}" stroke-width="2.8" stroke-linecap="round">
    <line x1="${cx1 - 9}" y1="${cy - 2}" x2="${cx1 + 8}" y2="${cy + 4}"/>
    <line x1="${cx2 + 9}" y1="${cy - 2}" x2="${cx2 - 8}" y2="${cy + 4}"/>
  </g>`;
}

function mascotMouth(mood, cx, cy, color) {
  if (mood === 'happy') {
    // wide smile with teeth hint
    return `<g>
      <path d="M${cx-13} ${cy-2} Q${cx} ${cy+13} ${cx+13} ${cy-2}" stroke="${color}" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <path d="M${cx-9} ${cy+1} Q${cx} ${cy+12} ${cx+9} ${cy+1}" fill="rgba(255,255,255,.28)"/>
    </g>`;
  }
  if (mood === 'sad') {
    return `<path d="M${cx-10} ${cy+6} Q${cx} ${cy-5} ${cx+10} ${cy+6}" stroke="${color}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  }
  // idle — gentle smile
  return `<path d="M${cx-10} ${cy+1} Q${cx} ${cy+9} ${cx+10} ${cy+1}" stroke="${color}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;
}

      <rect x="14" y="20" width="92" height="84" rx="8" fill="${caseLt}"/>
      <!-- top highlight -->
      <rect x="14" y="20" width="92" height="7" rx="8" fill="#fff" opacity=".1"/>`;
    // platter window cutout
    const platter = `
      <circle cx="54" cy="56" r="32" fill="${platCol}"/>
      <!-- platter rings -->
      <circle cx="54" cy="56" r="32" fill="none" stroke="${platShine}" stroke-width="1.5" opacity=".6"/>
      <circle cx="54" cy="56" r="24" fill="none" stroke="${platShine}" stroke-width="1" opacity=".4"/>
      <circle cx="54" cy="56" r="16" fill="none" stroke="${platShine}" stroke-width="1" opacity=".3"/>
      <!-- platter sheen -->
      <ellipse cx="46" cy="46" rx="12" ry="7" fill="#fff" opacity=".12" transform="rotate(-30 46 46)"/>
      <!-- spindle -->
      <circle cx="54" cy="56" r="5" fill="${caseCol}"/>
      <circle cx="54" cy="56" r="3" fill="${caseLt}"/>`;
    // read arm
    const arm = `
      <rect x="72" y="28" width="10" height="48" rx="5" fill="${caseCol}" transform="rotate(18 72 28)"/>
      <circle cx="85" cy="62" r="5" fill="${caseCol}"/>
      <circle cx="85" cy="62" r="3" fill="#1cb0f6" opacity=".7"/>`;
    // activity LED
    const led = `<circle cx="96" cy="26" r="4" fill="${mood==='happy'?'#58cc02':mood==='sad'?'#ff4b4b':'#1cb0f6'}" class="mascot-led"/>
                 <circle cx="96" cy="26" r="2" fill="#fff" opacity=".5"/>`;
    body = `
      <g class="mascot-body">
        ${chassis}
        ${platter}
        ${arm}
        ${led}
        ${mascotEyes(38, 70, 86, 8, '#1a1a28')}
        ${mascotBrows(38, 70, 74, '#b0b0c0', mood)}
        ${mascotMouth(mood, 54, 100, '#d0d0e0')}
      </g>`;

  } else {
    body = `<rect x="20" y="20" width="80" height="80" rx="12" fill="#ccc"/>`;
  }

  return `<svg class="mascot-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${body}</svg>`;
}

function renderHomeMascot() {
  const box = document.getElementById('home-mascot');
  if (!box) return;
  box.innerHTML =
    `<div class="mascot-friend mf-left">${mascotSVG('ram', 'idle')}</div>` +
    `<div class="mascot-hero">${mascotSVG('pc', 'happy')}</div>` +
    `<div class="mascot-friend mf-right">${mascotSVG('chip', 'idle')}</div>`;
}

function renderNoHeartsMascot() {
  const box = document.getElementById('no-hearts-mascot');
  if (!box) return;
  box.innerHTML = mascotSVG('ram', 'sad');
}

function renderLessonMascot(mood) {
  const el = document.getElementById('lesson-mascot');
  const elTop = document.getElementById('lesson-mascot-top');
  const svg = mascotSVG(lessonMascotType, mood);
  if (el) el.innerHTML = svg;
  if (elTop) elTop.innerHTML = svg;
}

function resetLessonMascot() {
  const el = document.getElementById('lesson-mascot');
  const elTop = document.getElementById('lesson-mascot-top');
  if (el) el.classList.remove('mascot-happy', 'mascot-sad');
  if (elTop) elTop.classList.remove('mascot-happy', 'mascot-sad');
  renderLessonMascot('idle');
}

function reactMascot(kind) {
  const el = document.getElementById('lesson-mascot');
  const elTop = document.getElementById('lesson-mascot-top');
  const mood = kind === 'happy' ? 'happy' : 'sad';
  renderLessonMascot(mood);
  
  [el, elTop].forEach(target => {
    if (target) {
      target.classList.remove('mascot-happy', 'mascot-sad');
      void target.offsetWidth;
      target.classList.add('mascot-' + mood);
    }
  });
}

// ============================================================
// MODAL GENÉRICO
// ============================================================
let modalCallback = null;

let modalCancelCallback = null;

function openModal(opts) {
  document.getElementById('modal-mascot').innerHTML = mascotSVG(opts.mascot || 'ram', opts.mood || 'idle');
  document.getElementById('modal-title').textContent = opts.title || '';
  const textEl = document.getElementById('modal-text');
  textEl.textContent = opts.text || '';
  // Support extra HTML content injected below title
  if (opts.extraContent) textEl.innerHTML = opts.extraContent;
  const cancelBtn = document.getElementById('modal-cancel');
  const confirmBtn = document.getElementById('modal-confirm');
  cancelBtn.textContent = opts.cancelText || 'Cancelar';
  confirmBtn.textContent = opts.confirmText || 'Aceptar';
  confirmBtn.className = 'btn-modal ' + (opts.confirmClass || 'green');
  cancelBtn.className = 'btn-modal ' + (opts.cancelClass || 'green');
  modalCallback = opts.onConfirm || null;
  modalCancelCallback = opts.onCancel || null;
  document.getElementById('exit-modal').classList.add('show');
}

function closeModal() {
  document.getElementById('exit-modal').classList.remove('show');
  modalCallback = null;
  modalCancelCallback = null;
}

// ============================================================
// PANTALLA DE PERFIL
// ============================================================
function renderProfile() {
  const avatar = document.getElementById('profile-avatar');
  if (avatar) avatar.innerHTML = mascotSVG('pc', 'happy');

  let lessonsTotal = 0, lessonsDone = 0, starsSum = 0;
  SUBJECTS.forEach(subject => {
    subject.units.forEach(unit => {
      unit.lessons.forEach(lesson => {
        lessonsTotal++;
        const p = getLessonProgress(lesson.id);
        if (p.completed) {
          lessonsDone++;
          starsSum += (p.stars || 0);
        }
      });
    });
  });

  const stats = [
    { icon: '⚡', val: state.xp, label: 'XP total' },
    { icon: '💎', val: state.gems, label: 'Gemas' },
    { icon: '🔥', val: state.streak + ' d', label: 'Racha' },
    { icon: '❤️', val: state.hearts + '/' + state.maxHearts, label: 'Vidas' },
    { icon: '📘', val: lessonsDone + '/' + lessonsTotal, label: 'Lecciones' },
    { icon: '⭐', val: starsSum, label: 'Estrellas' }
  ];

  const grid = document.getElementById('profile-grid');
  grid.innerHTML = stats.map(s => `
    <div class="profile-stat">
      <div class="ps-icon">${s.icon}</div>
      <div class="ps-val">${s.val}</div>
      <div class="ps-label">${s.label}</div>
    </div>`).join('');
}

// ============================================================
// HELPERS
// ============================================================
const TAB_SCREENS = { 'screen-home': 'home', 'screen-profile': 'profile' };

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById(id);
  target.classList.add('active');
  window.scrollTo(0, 0);

  const inLessonFlow = id === 'screen-lesson' || id === 'screen-result' || id === 'screen-no-hearts';
  document.body.classList.toggle('no-chrome', inLessonFlow);

  const activeTab = TAB_SCREENS[id];
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
}

function switchTab(tab) {
  if (tab === 'profile') {
    renderProfile();
    showScreen('screen-profile');
  } else {
    renderHome();
    showScreen('screen-home');
  }
}

// ---- Handlers de la barra inferior y del modal ----
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => switchTab(tab.dataset.tab);
});

document.getElementById('modal-cancel').onclick = () => {
  const cb = modalCancelCallback;
  closeModal();
  if (cb) cb();
};

document.getElementById('modal-confirm').onclick = () => {
  const cb = modalCallback;
  closeModal();
  if (cb) cb();
};

document.getElementById('exit-modal').onclick = (e) => {
  if (e.target.id === 'exit-modal') closeModal();
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function shuffleIndices(n) {
  const arr = Array.from({ length: n }, (_, i) => i);
  return shuffleArray(arr);
}

// ============================================================
// CONFETTI
// ============================================================
const fxParticles = [];
let fxRunning = false;

function launchConfetti(opts) {
  opts = opts || {};
  const canvas = document.getElementById('fx-canvas');
  if (!canvas) return;
  const cw = canvas.clientWidth || window.innerWidth;
  const ch = canvas.clientHeight || window.innerHeight;
  if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }

  const box = canvas.getBoundingClientRect();
  const ox = opts.x != null ? opts.x - box.left : canvas.width / 2;
  const oy = opts.y != null ? opts.y - box.top : canvas.height / 2;
  const count = opts.count || 80;
  const power = opts.power || 1;

  const colors = ['#58cc02', '#1cb0f6', '#ce82ff', '#ff4b4b', '#ffc800', '#ff9600', '#ff86d0'];
  const shapes = ['circle', 'square', 'star', 'heart'];

  for (let i = 0; i < count; i++) {
    let vx, vy;
    if (opts.radial) {
      const ang = Math.random() * Math.PI * 2;
      const sp = (2 + Math.random() * 9) * power;
      vx = Math.cos(ang) * sp;
      vy = Math.sin(ang) * sp - 2.5;
    } else {
      vx = (Math.random() - 0.5) * 15 * power;
      vy = (-Math.random() * 20 - 5) * power;
    }
    fxParticles.push({
      x: ox + (Math.random() - 0.5) * (opts.radial ? 12 : 200),
      y: oy,
      vx: vx,
      vy: vy,
      gravity: 0.5,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      shape: shapes[Math.floor(Math.random() * shapes.length)],
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 10,
      life: 120,
      maxLife: 120,
      opacity: 1
    });
  }

  if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxLoop); }
}

function fxLoop() {
  const canvas = document.getElementById('fx-canvas');
  if (!canvas) { fxRunning = false; return; }
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = fxParticles.length - 1; i >= 0; i--) {
    const p = fxParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.rotation += p.rotationSpeed;
    p.life -= 1;
    p.opacity = Math.max(0, Math.min(1, p.life / 45));

    ctx.save();
    ctx.globalAlpha = p.opacity;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation * Math.PI / 180);
    ctx.fillStyle = p.color;

    if (p.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.shape === 'square') {
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    } else if (p.shape === 'star') {
      drawStar(ctx, 0, 0, 5, p.size / 2, p.size / 4);
      ctx.fill();
    } else if (p.shape === 'heart') {
      drawHeart(ctx, 0, 0, p.size);
    }

    ctx.restore();

    if (p.life <= 0 || p.y > canvas.height + 60) fxParticles.splice(i, 1);
  }

  if (fxParticles.length) {
    requestAnimationFrame(fxLoop);
  } else {
    fxRunning = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

function drawStar(ctx, cx, cy, spikes, outer, inner) {
  let rot = Math.PI / 2 * 3;
  let x = cx, y = cy;
  const step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outer);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outer;
    y = cy + Math.sin(rot) * outer;
    ctx.lineTo(x, y);
    rot += step;
    x = cx + Math.cos(rot) * inner;
    y = cy + Math.sin(rot) * inner;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outer);
  ctx.closePath();
}

function drawHeart(ctx, x, y, size) {
  ctx.beginPath();
  const s = size / 4;
  ctx.moveTo(x, y + s);
  ctx.bezierCurveTo(x, y, x - s, y, x - s, y + s);
  ctx.bezierCurveTo(x - s, y + s * 2, x, y + s * 2.5, x, y + s * 3);
  ctx.bezierCurveTo(x, y + s * 2.5, x + s, y + s * 2, x + s, y + s);
  ctx.bezierCurveTo(x + s, y, x, y, x, y + s);
  ctx.fill();
}
