function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function shuffleIndices(n) {
  const arr = Array.from({ length: n }, (_, i) => i);
  return shuffleArray(arr);
}

// ============================================================
// CONFETTI
// ============================================================
const fxParticles = [];
let fxRunning = false;

function launchConfetti(opts) {
  opts = opts || {};
  const canvas = document.getElementById('fx-canvas');
  if (!canvas) return;
  const cw = canvas.clientWidth || window.innerWidth;
  const ch = canvas.clientHeight || window.innerHeight;
  if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }

  const box = canvas.getBoundingClientRect();
  const ox = opts.x != null ? opts.x - box.left : canvas.width / 2;
  const oy = opts.y != null ? opts.y - box.top : canvas.height / 2;
  const count = opts.count || 80;
  const power = opts.power || 1;

  const colors = ['#58cc02', '#1cb0f6', '#ce82ff', '#ff4b4b', '#ffc800', '#ff9600', '#ff86d0'];
  const shapes = ['circle', 'square', 'star', 'heart'];

  for (let i = 0; i < count; i++) {
    let vx, vy;
    if (opts.radial) {
      const ang = Math.random() * Math.PI * 2;
      const sp = (2 + Math.random() * 9) * power;
      vx = Math.cos(ang) * sp;
      vy = Math.sin(ang) * sp - 2.5;
    } else {
      vx = (Math.random() - 0.5) * 15 * power;
      vy = (-Math.random() * 20 - 5) * power;
    }
    fxParticles.push({
      x: ox + (Math.random() - 0.5) * (opts.radial ? 12 : 200),
      y: oy,
      vx: vx,
      vy: vy,
      gravity: 0.5,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      shape: shapes[Math.floor(Math.random() * shapes.length)],
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 10,
      life: 120,
      maxLife: 120,
      opacity: 1
    });
  }

  if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxLoop); }
}

function fxLoop() {
  const canvas = document.getElementById('fx-canvas');
  if (!canvas) { fxRunning = false; return; }
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = fxParticles.length - 1; i >= 0; i--) {
    const p = fxParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.rotation += p.rotationSpeed;
    p.life -= 1;
    p.opacity = Math.max(0, Math.min(1, p.life / 45));

    ctx.save();
    ctx.globalAlpha = p.opacity;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation * Math.PI / 180);
    ctx.fillStyle = p.color;

    if (p.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.shape === 'square') {
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    } else if (p.shape === 'star') {
      drawStar(ctx, 0, 0, 5, p.size / 2, p.size / 4);
      ctx.fill();
    } else if (p.shape === 'heart') {
      drawHeart(ctx, 0, 0, p.size);
    }

    ctx.restore();

    if (p.life <= 0 || p.y > canvas.height + 60) fxParticles.splice(i, 1);
  }

  if (fxParticles.length) {
    requestAnimationFrame(fxLoop);
  } else {
    fxRunning = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

function drawStar(ctx, cx, cy, spikes, outer, inner) {
  let rot = Math.PI / 2 * 3;
  let x = cx, y = cy;
  const step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outer);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outer;
    y = cy + Math.sin(rot) * outer;
    ctx.lineTo(x, y);
    rot += step;
    x = cx + Math.cos(rot) * inner;
    y = cy + Math.sin(rot) * inner;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outer);
  ctx.closePath();
}

function drawHeart(ctx, x, y, size) {
  ctx.beginPath();
  const s = size / 4;
  ctx.moveTo(x, y + s);
  ctx.bezierCurveTo(x, y, x - s, y, x - s, y + s);
  ctx.bezierCurveTo(x - s, y + s * 2, x, y + s * 2.5, x, y + s * 3);
  ctx.bezierCurveTo(x, y + s * 2.5, x + s, y + s * 2, x + s, y + s);
  ctx.bezierCurveTo(x + s, y, x, y, x, y + s);
  ctx.fill();
}

setInterval(() => {
  const oldHearts = state.hearts;
  regenerateHearts();
  if (state.hearts !== oldHearts) {
    saveState();
    updateTopBar();
    if (document.getElementById('screen-lesson').classList.contains('active')) {
      updateLessonHeader();
    }
  }
}, 60000);

</script>
