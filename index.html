<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<title>Asirlingo — Aprende ASIR jugando</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root{
  /* ---- Feather palette ---- */
  --green:#58cc02; --green-d:#58a700; --green-lt:#d7ffb8; --green-bd:#a5ed6e;
  --blue:#1cb0f6;  --blue-d:#1899d6;  --blue-lt:#ddf4ff;  --blue-bd:#84d8ff;
  --purple:#ce82ff;--purple-d:#a560e8;--purple-lt:#f6ecff;--purple-bd:#e3bcff;
  --red:#ff4b4b;   --red-d:#ea2b2b;   --red-lt:#ffdfe0;   --red-bd:#ffb3b3;
  --yellow:#ffc800;--yellow-d:#e6a500;--yellow-lt:#fff4d1;--yellow-bd:#ffe066;
  --orange:#ff9600;--orange-d:#e08600;--orange-lt:#ffeada;--orange-bd:#ffc78a;
  --pink:#ff86d0;  --pink-d:#e06cb8;
  /* ---- Neutrals (light mode) ---- */
  --snow:#ffffff; --polar:#f7f7f7; --swan:#e5e5e5; --hare:#afafaf; --wolf:#777777; --eel:#4b4b4b;
  --txt:#4b4b4b; --txt-dim:#777777; --txt-dimmer:#afafaf;
  --bg-card:#ffffff;
  /* ---- Surface tokens (override in dark) ---- */
  --surface-app:var(--snow);
  --surface-card:var(--snow);
  --surface-bar:rgba(255,255,255,.94);
  --surface-polar:var(--polar);
  --border-color:var(--swan);
  --shadow-pop:0 10px 30px rgba(0,0,0,.12);
  /* ---- Aliases ---- */
  --duo-green:var(--green); --duo-green-d:var(--green-d);
  --duo-blue:var(--blue);   --duo-blue-d:var(--blue-d);
  --duo-purple:var(--purple); --duo-red:var(--red); --duo-yellow:var(--yellow);
  /* ---- System ---- */
  --radius-sm:12px; --radius:16px; --radius-lg:20px; --radius-xl:26px;
  --font:'Nunito','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --lip:4px;
  --trans:all .18s cubic-bezier(.4,0,.2,1);
  --topbar-h:60px; --tabbar-h:68px; --sidebar-w:272px; --amp:56px;
}

/* ============================================================
   MODO OSCURO — detectado automáticamente del sistema
   ============================================================ */
@media (prefers-color-scheme: dark) {
  :root {
    /* Acentos un poco más vivos en oscuro */
    --green:#58cc02;   --green-d:#4aad00;  --green-lt:#1a3800;  --green-bd:#2d6600;
    --blue:#1cb0f6;    --blue-d:#0e90cc;   --blue-lt:#002840;   --blue-bd:#0a5880;
    --purple:#c46ef5;  --purple-d:#9a4ed0; --purple-lt:#280048; --purple-bd:#5a1890;
    --red:#ff5555;     --red-d:#d83030;    --red-lt:#3d0808;    --red-bd:#7a1010;
    --yellow:#ffd000;  --yellow-d:#d4a800; --yellow-lt:#2e2400; --yellow-bd:#6a5000;
    --orange:#ff9800;  --orange-d:#d07800; --orange-lt:#2c1a00; --orange-bd:#6a4000;
    /* Escala de grises invertida */
    --snow:#1a1a2e;
    --polar:#22223a;
    --swan:#333358;
    --hare:#5a5a80;
    --wolf:#9090b8;
    --eel:#d0d0f0;
    --txt:#d0d0f0;
    --txt-dim:#9090b8;
    --txt-dimmer:#5a5a80;
    --bg-card:#22223a;
    /* Superficies */
    --surface-app:#1a1a2e;
    --surface-card:#22223a;
    --surface-bar:rgba(26,26,46,.92);
    --surface-polar:#22223a;
    --border-color:#333358;
    --shadow-pop:0 10px 30px rgba(0,0,0,.45);
  }
}

html{ font-size:16px; -webkit-text-size-adjust:100%; }

body{
  font-family:var(--font);
  background:var(--surface-app);
  color:var(--txt);
  min-height:100dvh;
  line-height:1.5;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
  color-scheme: light dark;
}

/* ============================================================
   SHELL RESPONSIVE
   ============================================================ */
.app{
  display:flex;
  flex-direction:column;
  min-height:100dvh;
  width:100%;
}

.top-bar{
  position:sticky; top:0; z-index:100;
  height:var(--topbar-h); flex-shrink:0;
  display:flex; align-items:center; gap:14px;
  padding:0 clamp(12px,3vw,28px);
  background:var(--surface-bar);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border-bottom:2px solid var(--border-color);
}
.brand{
  display:flex; align-items:center; gap:9px;
  font-weight:900; font-size:1.18rem; letter-spacing:-.02em; color:var(--eel);
  white-space:nowrap;
}
.brand-dot{
  width:26px; height:26px; border-radius:9px;
  background:linear-gradient(145deg,var(--green) 0%,#89e219 100%);
  box-shadow:0 3px 0 var(--green-d);
  position:relative;
}
.brand-dot::after{
  content:''; position:absolute; inset:7px 6px 6px 7px; border-radius:50%;
  background:#fff; opacity:.9;
}
.top-stats{ margin-left:auto; display:flex; align-items:center; gap:clamp(6px,1.6vw,14px); }
.stat-pill{
  display:flex; align-items:center; gap:6px;
  font-size:1.05rem; font-weight:800; font-variant-numeric:tabular-nums;
  color:var(--eel); white-space:nowrap;
}
.stat-pill .icon{ font-size:1.22rem; line-height:1; }
.stat-pill .val{ display:inline-block; }
.stat-pill .val.bump{ animation:bumpScale .45s cubic-bezier(.34,1.56,.64,1); }
@keyframes bumpScale{
  0%{transform:scale(1)} 35%{transform:scale(1.45)} 70%{transform:scale(.94)} 100%{transform:scale(1)}
}
.stat-pill.hearts .icon{ color:var(--red); }
.stat-pill.xp .icon{ color:var(--yellow-d); }
.stat-pill.gems .icon{ color:var(--blue); }
.stat-pill.streak.pulse .icon{ animation:flame 1.7s ease-in-out infinite; }
@keyframes flame{
  0%,100%{transform:scale(1) rotate(0)}
  30%{transform:scale(1.14) rotate(-5deg)}
  60%{transform:scale(.96) rotate(4deg)}
}

.stage{
  position:relative;
  flex:1;
  display:flex;
  flex-direction:column;
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
}

/* ============================================================
   SCREENS
   ============================================================ */
.screen{
  display:none;
  width:100%;
  flex:1;
  flex-direction:column;
  align-items:center;
}
.screen.active{ display:flex; animation:screenIn .34s cubic-bezier(.2,.85,.3,1); }
@keyframes screenIn{
  from{ opacity:0; transform:translateY(16px) scale(.99); }
  to{ opacity:1; transform:none; }
}

/* ============================================================
   HOME — CAMINO DE APRENDIZAJE (niveles)
   ============================================================ */
#screen-home{ padding-bottom:34px; }
.home-mascot{ padding-top:22px; }
.home-title{
  font-size:clamp(1.9rem,6vw,2.7rem);
  font-weight:900; text-align:center; letter-spacing:-.03em;
  color:var(--eel); padding:0 16px;
}
.home-title span{
  background:linear-gradient(100deg,var(--green),var(--blue) 45%,var(--purple) 70%,var(--green));
  background-size:250% 100%;
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  animation:titleShift 6s linear infinite;
}
@keyframes titleShift{ 0%{background-position:0% 0} 100%{background-position:250% 0} }
.home-subtitle{
  text-align:center; color:var(--wolf); font-weight:700;
  font-size:clamp(.85rem,2.4vw,1rem); padding:4px 20px 8px;
}
.path-container{
  width:100%; max-width:640px;
  padding:6px 16px 10px;
  display:flex; flex-direction:column;
}
.subject-block{ width:100%; display:flex; flex-direction:column; align-items:center; }

/* ---- Banner de unidad / materia ---- */
.unit-banner{
  width:100%;
  display:flex; align-items:center; gap:14px;
  margin:26px 0 34px; padding:15px 20px;
  border-radius:var(--radius);
  color:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.22);
  animation:screenIn .4s cubic-bezier(.2,.85,.3,1) backwards;
}
.unit-banner .ub-ico{ font-size:1.9rem; line-height:1; filter:drop-shadow(0 2px 2px rgba(0,0,0,.2)); }
.unit-banner .ub-body{ flex:1; min-width:0; }
.unit-banner .ub-kicker{
  font-size:.64rem; font-weight:900; letter-spacing:2px; text-transform:uppercase;
  opacity:.85;
}
.unit-banner .ub-name{ font-size:1.02rem; font-weight:900; line-height:1.25; }
.unit-banner .ub-meta{ font-size:.75rem; font-weight:700; opacity:.9; }
.unit-banner .ub-ring{
  position:relative; width:44px; height:44px; flex-shrink:0; border-radius:50%;
  background:rgba(255,255,255,.25);
  display:flex; align-items:center; justify-content:center;
  font-size:.78rem; font-weight:900;
}
.unit-banner.aso{ background:linear-gradient(160deg,#ff7676,var(--red)); box-shadow:0 4px 0 var(--red-d); }
.unit-banner.fh{ background:linear-gradient(160deg,#89e219,var(--green)); box-shadow:0 4px 0 var(--green-d); }
.unit-banner.iso{ background:linear-gradient(160deg,#5cc8ff,var(--blue)); box-shadow:0 4px 0 var(--blue-d); }
.unit-banner.par{ background:linear-gradient(160deg,#ffb44d,var(--orange)); box-shadow:0 4px 0 var(--orange-d); }

/* ---- Filas del camino (zigzag) ---- */
.path-rows{
  display:flex; flex-direction:column; align-items:center;
  gap:18px; padding:38px 0 6px;
}
.node-row{
  position:relative;
  display:flex; flex-direction:column; align-items:center;
  transform:translateX(var(--dx,0));
}
/* Color de materia para cada nodo del camino */
.node-row.aso{ --node-color:var(--red);    --node-lip:var(--red-d); }
.node-row.fh { --node-color:var(--green);  --node-lip:var(--green-d); }
.node-row.iso{ --node-color:var(--blue);   --node-lip:var(--blue-d); }
.node-row.par{ --node-color:var(--orange); --node-lip:var(--orange-d); }

.node-cue{
  position:absolute; top:-34px; left:50%;
  transform:translateX(-50%);
  font-size:.62rem; font-weight:900; letter-spacing:1.2px; text-transform:uppercase;
  color:var(--node-color,var(--green));
  background:var(--node-color,var(--green));
  color:#fff; padding:3px 10px; border-radius:999px;
  white-space:nowrap;
  animation:bobCue 1.5s ease-in-out infinite;
}
@keyframes bobCue{
  0%,100%{ transform:translate(-50%,0); }
  50%{ transform:translate(-50%,-4px); }
}

.node{
  position:relative; width:76px; height:76px; border-radius:50%;
  border:none; cursor:pointer; padding:0;
  background:var(--node-color,var(--green));
  box-shadow:0 6px 0 var(--node-lip,var(--green-d));
  color:#fff; font-size:1.85rem; line-height:1;
  display:flex; align-items:center; justify-content:center;
  transition:transform .13s cubic-bezier(.4,0,.2,1), box-shadow .13s, filter .2s;
  animation:nodeIn .5s cubic-bezier(.34,1.56,.64,1) backwards;
  animation-delay:var(--d,0s);
  -webkit-user-select:none; user-select:none;
}
@keyframes nodeIn{
  from{ opacity:0; transform:scale(.35) translateY(22px); }
  to{ opacity:1; transform:scale(1) translateY(0); }
}
.node .node-ico{ filter:drop-shadow(0 2px 1px rgba(0,0,0,.25)); pointer-events:none; }
.node:hover{ transform:translateY(-3px); box-shadow:0 9px 0 var(--node-lip,var(--green-d)); filter:brightness(1.06); }
.node:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--node-lip,var(--green-d)); }
.node:focus-visible{ outline:3px solid var(--blue); outline-offset:4px; }

.node.current{ animation:nodeIn .5s cubic-bezier(.34,1.56,.64,1) backwards; }
.node.current::after{
  content:''; position:absolute; inset:-8px; border-radius:50%;
  border:4px solid var(--node-color,var(--green));
  animation:ping 1.9s cubic-bezier(0,0,.2,1) infinite;
}
@keyframes ping{
  0%{ transform:scale(.92); opacity:.75; }
  75%,100%{ transform:scale(1.28); opacity:0; }
}

.node.locked{
  background:var(--swan); box-shadow:0 6px 0 #d4d4d4; cursor:not-allowed;
  color:var(--hare); font-size:1.5rem;
}
.node.locked:hover{ transform:none; box-shadow:0 6px 0 #d4d4d4; filter:none; }
.node.locked:active{ transform:none; }

.node-badge{
  position:absolute; right:-5px; bottom:-5px;
  width:27px; height:27px; border-radius:50%;
  background:var(--surface-card); color:var(--green);
  border:2px solid var(--border-color);
  display:flex; align-items:center; justify-content:center;
  font-size:.9rem; font-weight:900; line-height:1;
}

.node-stars{ display:flex; gap:3px; margin-top:9px; font-size:.82rem; line-height:1; }
.node-stars .s{ color:var(--swan); }
.node-stars .s.on{ color:var(--yellow); text-shadow:0 1px 0 var(--yellow-d); animation:starPop .5s cubic-bezier(.34,1.56,.64,1) backwards; }
.node-stars .s.on:nth-child(1){ animation-delay:.25s; }
.node-stars .s.on:nth-child(2){ animation-delay:.4s; }
.node-stars .s.on:nth-child(3){ animation-delay:.55s; }
.node-stars .s.off{ color:var(--swan); }

.node-label{
  max-width:min(200px,50vw); margin-top:5px;
  text-align:center; font-size:.76rem; font-weight:800; line-height:1.25;
  color:var(--eel);
  opacity:0; transform:translateY(-3px);
  transition:opacity .2s, transform .2s;
  pointer-events:none; min-height:1.9em;
}
.node-row:hover .node-label,
.node-row:focus-within .node-label{ opacity:1; transform:none; }
.node-row.current .node-label{ opacity:1; transform:none; color:var(--node-color,var(--green)); }

/* ============================================================
   LECCIÓN
   ============================================================ */
#screen-lesson{ min-height:100dvh; }
.lesson-header{
  position:sticky; top:0; z-index:60; flex-shrink:0;
  width:100%;
  display:flex; align-items:center; gap:clamp(8px, 2vw, 14px);
  padding:10px clamp(12px, 3vw, 24px);
  background:var(--surface-card);
  border-bottom:2px solid var(--border-color);
}
.lesson-mascot-top{
  width: 130px;
  height: 130px;
  margin: 0 auto 12px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 8px 16px rgba(0,0,0,0.1));
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 10;
  position: relative;
}
.lesson-mascot-top .mascot-svg{ width:100%; height:100%; }
.lesson-mascot-top:hover { transform: scale(1.05) translateY(-5px); }
.lesson-close{
  display:flex; align-items:center; justify-content:center;
  width:38px; height:38px; flex-shrink:0;
  background:var(--surface-polar); border:2px solid var(--border-color); border-bottom-width:3px;
  cursor:pointer; color:var(--wolf);
  font-size:1.1rem; line-height:1;
  border-radius:12px; transition:var(--trans);
  font-family:var(--font);
}
.lesson-close:hover{
  color:var(--red); background:var(--red-lt);
  border-color:var(--red-bd);
  transform:rotate(90deg) scale(1.08);
}
.lesson-close:active{ transform:rotate(90deg) translateY(2px); box-shadow:none; }
.lesson-progress{
  flex:1; height:16px; border-radius:99px; overflow:hidden;
  background:var(--swan); position:relative;
}
.lesson-progress-bar{
  height:100%; width:0%; border-radius:99px;
  background:linear-gradient(180deg,#7fe02b,var(--green));
  transition:width .45s cubic-bezier(.2,.85,.3,1);
  position:relative; overflow:hidden;
}
.lesson-progress-bar::after{
  content:''; position:absolute; left:6px; right:6px; top:3px; height:4px;
  border-radius:99px; background:rgba(255,255,255,.55);
}
.lesson-progress-bar::before{
  content:''; position:absolute; top:0; bottom:0; width:60px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  animation:shine 1.9s linear infinite;
}
@keyframes shine{ from{ left:-70px; } to{ left:100%; } }

.lesson-hearts{
  display:flex; align-items:center; gap:5px;
  font-size:1.12rem; font-weight:900; color:var(--red);
}
.lesson-hearts.shake{ animation:shake .45s ease; }
@keyframes shake{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-6px); }
  40%{ transform:translateX(6px); }
  60%{ transform:translateX(-4px); }
  80%{ transform:translateX(4px); }
}

.lesson-body{
  flex:1; width:100%; max-width:660px; margin:0 auto;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:26px clamp(16px,4vw,26px) 30px;
}

.q-type-label{
  font-size:.72rem; font-weight:900; letter-spacing:1.6px; text-transform:uppercase;
  color:var(--blue-d); background:var(--blue-lt);
  padding:5px 14px; border-radius:99px; margin-bottom:18px;
  animation:screenIn .35s backwards;
}
.q-prompt{
  font-size:clamp(1.2rem,4vw,1.6rem); font-weight:800; line-height:1.4;
  text-align:center; color:var(--eel); margin-bottom:22px;
  animation:screenIn .35s .05s backwards;
}
.q-subtitle{
  font-size:clamp(.85rem,2.6vw,1rem); font-weight:700; color:var(--wolf);
  text-align:center; margin:-12px 0 20px;
}

/* ---- Opción múltiple ---- */
.mc-answers{
  display:flex; flex-direction:column; gap:12px; width:100%; max-width:520px;
}
.mc-answer{
  display:flex; align-items:center; gap:14px;
  width:100%; padding:14px 18px;
  background:var(--surface-card);
  border:2px solid var(--border-color); border-bottom-width:4px;
  border-radius:var(--radius-sm);
  font-family:var(--font); font-size:1rem; font-weight:800; color:var(--eel);
  text-align:left; cursor:pointer;
  transition:var(--trans);
  position:relative; overflow:hidden;
  animation:screenIn .35s backwards;
}
.mc-answer:nth-child(1){ animation-delay:.05s; }
.mc-answer:nth-child(2){ animation-delay:.1s; }
.mc-answer:nth-child(3){ animation-delay:.15s; }
.mc-answer:nth-child(4){ animation-delay:.2s; }
.mc-answer:nth-child(5){ animation-delay:.25s; }
.mc-answer:hover{ border-color:var(--hare); background:var(--polar); }
.mc-answer:active{ transform:translateY(2px); border-bottom-width:2px; }
.mc-answer .mc-icon{
  width:34px; height:34px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  border:2px solid var(--swan); border-radius:9px;
  font-size:.9rem; font-weight:900; color:var(--wolf);
  transition:var(--trans);
}
.mc-answer.selected{ border-color:var(--blue); background:var(--blue-lt); color:var(--blue-d); }
.mc-answer.selected .mc-icon{ border-color:var(--blue); background:var(--blue); color:#fff; }
.mc-answer.correct{ border-color:var(--green); background:var(--green-lt); color:var(--green-d); }
.mc-answer.correct .mc-icon{ border-color:var(--green); background:var(--green); color:#fff; }
.mc-answer.incorrect{ border-color:var(--red); background:var(--red-lt); color:var(--red-d); }
.mc-answer.incorrect .mc-icon{ border-color:var(--red); background:var(--red); color:#fff; }
.mc-answer.disabled{ pointer-events:none; opacity:.55; }

/* ---- Verdadero / Falso ---- */
.tf-answers{ display:flex; gap:16px; width:100%; max-width:520px; }
.tf-btn{
  flex:1; padding:20px 14px; border:none; border-radius:var(--radius);
  font-family:var(--font); font-size:1.05rem; font-weight:900;
  letter-spacing:1px; text-transform:uppercase; color:#fff;
  cursor:pointer; transition:var(--trans); position:relative; overflow:hidden;
  animation:screenIn .35s backwards;
}
.tf-btn:nth-child(2){ animation-delay:.08s; }
.tf-true{ background:var(--green); box-shadow:0 4px 0 var(--green-d); }
.tf-true:hover{ filter:brightness(1.06); transform:translateY(-2px); box-shadow:0 6px 0 var(--green-d); }
.tf-true:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--green-d); }
.tf-false{ background:var(--red); box-shadow:0 4px 0 var(--red-d); }
.tf-false:hover{ filter:brightness(1.06); transform:translateY(-2px); box-shadow:0 6px 0 var(--red-d); }
.tf-false:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--red-d); }
.tf-btn.correct{ outline:4px solid var(--green); outline-offset:2px; animation:popOk .4s cubic-bezier(.34,1.56,.64,1); }
.tf-btn.incorrect{ outline:4px solid var(--red); outline-offset:2px; animation:shake .45s ease; }
@keyframes popOk{ 0%{transform:scale(1)} 50%{transform:scale(1.05)} 100%{transform:scale(1)} }

/* ---- Completar hueco ---- */
.fill-input-container{
  width:100%; max-width:520px;
  display:flex; flex-direction:column; align-items:center; gap:22px;
}
.fill-sentence{
  font-size:clamp(1.05rem,3.6vw,1.4rem); font-weight:800; line-height:2.1;
  text-align:center; color:var(--eel);
}
.fill-slot{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:104px; min-height:44px; padding:4px 16px; margin:0 4px;
  border-bottom:3px solid var(--hare);
  font-weight:900; color:var(--blue-d);
  transition:var(--trans); cursor:pointer;
}
.fill-slot.filled{
  border-bottom-color:var(--blue); background:var(--blue-lt); border-radius:10px;
  animation:popOk .3s cubic-bezier(.34,1.56,.64,1);
}
.fill-slot.correct{ border-bottom-color:var(--green); background:var(--green-lt); color:var(--green-d); animation:popOk .4s; }
.fill-slot.incorrect{ border-bottom-color:var(--red); background:var(--red-lt); color:var(--red-d); animation:shake .45s; }
.fill-bank{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.fill-word{
  padding:11px 20px; background:var(--surface-card);
  border:2px solid var(--border-color); border-bottom-width:4px;
  border-radius:var(--radius-sm);
  font-family:var(--font); font-size:.98rem; font-weight:800; color:var(--eel);
  cursor:pointer; transition:var(--trans); position:relative; overflow:hidden;
  animation:screenIn .35s backwards;
}
.fill-word:hover{ border-color:var(--hare); background:var(--polar); transform:translateY(-2px); }
.fill-word:active{ transform:translateY(2px); border-bottom-width:2px; }
.fill-word.used{ opacity:0; pointer-events:none; transform:scale(.8); }

/* Flying word animation */
.flying-word{
  position:fixed; z-index:1000; pointer-events:none;
  background:var(--surface-card); border:2px solid var(--border-color);
  border-bottom-width:4px; border-radius:var(--radius-sm);
  padding:11px 20px; font-weight:800; color:var(--eel); font-family:var(--font);
  transition:all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.mc-answer:active{ transform:scale(.96); }
.tf-btn:active{ transform:scale(.96); }

/* ---- Emparejar ---- */
.match-container{ width:100%; max-width:540px; }
.match-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
.match-item{
  padding:14px 10px; background:var(--surface-card);
  border:2px solid var(--border-color); border-bottom-width:4px;
  border-radius:var(--radius-sm);
  font-weight:800; font-size:.9rem; color:var(--eel);
  text-align:center; cursor:pointer; transition:var(--trans);
  position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center; min-height:56px;
  animation:screenIn .35s backwards;
}
.match-item:hover{ border-color:var(--hare); background:var(--polar); }
.match-item:active{ transform:translateY(2px); border-bottom-width:2px; }
.match-item.selected{ border-color:var(--blue); background:var(--blue-lt); color:var(--blue-d); }
.match-item.matched{
  border-color:var(--green); background:var(--green-lt); color:var(--green-d);
  pointer-events:none; opacity:.62; animation:popOk .4s;
}
.match-item.wrong{ border-color:var(--red); background:var(--red-lt); color:var(--red-d); animation:shake .5s; }

/* ============================================================
   BARRA DE FEEDBACK (fija abajo)
   ============================================================ */
.lesson-footer{
  position:sticky; bottom:0; z-index:60; flex-shrink:0;
  width:100%;
  display:flex; align-items:center; gap:16px;
  padding:14px clamp(14px,3vw,26px) calc(14px + env(safe-area-inset-bottom));
  background:var(--surface-card);
  border-top:2px solid var(--border-color);
  transition:background .22s ease, border-color .22s ease;
}
.lesson-footer.correct{ background:var(--green-lt); border-top-color:var(--green-bd); }
.lesson-footer.wrong{ background:var(--red-lt); border-top-color:var(--red-bd); }
.lesson-mascot{
  width:46px; height:46px; flex-shrink:0;
  opacity:0; transform:scale(.6); transition:opacity .25s, transform .25s;
}
.lesson-footer.show .lesson-mascot{ opacity:1; transform:scale(1); }
.lesson-feedback-text{
  flex:1; min-width:0;
  font-size:1.02rem; font-weight:900; color:var(--eel);
  opacity:0; transform:translateY(6px); transition:opacity .25s, transform .25s;
  display: flex;
  flex-direction: column;
}
.feedback-explanation {
  font-size: 0.85rem;
  font-weight: 500;
  margin-top: 4px;
  line-height: 1.2;
  color: var(--wolf);
}
.lesson-footer.wrong .feedback-explanation { color: var(--red-d); opacity: 0.9; }
.lesson-footer.show .lesson-feedback-text{ opacity:1; transform:none; }
.lesson-footer.correct .lesson-feedback-text{ color:var(--green-d); }
.lesson-footer.wrong .lesson-feedback-text{ color:var(--red-d); }

.btn-continue{
  flex-shrink:0;
  padding:13px 30px;
  background:var(--green); color:#fff; border:none;
  border-radius:var(--radius-sm);
  font-family:var(--font); font-size:.95rem; font-weight:900;
  letter-spacing:.8px; text-transform:uppercase; cursor:pointer;
  box-shadow:0 4px 0 var(--green-d);
  transition:var(--trans);
  animation:popOk .35s cubic-bezier(.34,1.56,.64,1);
}
.btn-continue:hover{ filter:brightness(1.07); }
.btn-continue:active{ transform:translateY(4px); box-shadow:0 0 0 var(--green-d); }
.btn-continue.wrong{ background:var(--red); box-shadow:0 4px 0 var(--red-d); }
.btn-continue:disabled{ background:var(--swan); color:var(--hare); box-shadow:none; cursor:not-allowed; }

/* ============================================================
   RESULTADO
   ============================================================ */
#screen-result{ justify-content:center; padding:30px 18px 40px; }
.result-card{
  width:100%; max-width:520px;
  background:var(--surface-card);
  border:2px solid var(--border-color); border-radius:var(--radius-xl);
  padding:34px clamp(20px,5vw,36px) 28px;
  text-align:center;
  animation:cardPop .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes cardPop{
  from{ opacity:0; transform:translateY(24px) scale(.94); }
  to{ opacity:1; transform:none; }
}
.result-mascot{ width:112px; height:112px; margin:0 auto 6px; }
.result-title{ font-size:clamp(1.5rem,5vw,1.95rem); font-weight:900; color:var(--eel); letter-spacing:-.02em; }
.result-subtitle{ font-size:1rem; font-weight:800; color:var(--wolf); margin-bottom:20px; }
.result-stars{ display:flex; justify-content:center; gap:10px; margin:6px 0 22px; }
.result-star{
  font-size:2.6rem; line-height:1; color:var(--swan);
  transition:color .3s;
}
.result-star.earned{ color:var(--yellow); text-shadow:0 3px 0 var(--yellow-d); animation:starPop .55s cubic-bezier(.34,1.56,.64,1) backwards; }
.result-star.earned:nth-child(1){ animation-delay:.2s; }
.result-star.earned:nth-child(2){ animation-delay:.42s; }
.result-star.earned:nth-child(3){ animation-delay:.64s; }
@keyframes starPop{
  0%{ opacity:0; transform:scale(0) rotate(-170deg); }
  65%{ opacity:1; transform:scale(1.3) rotate(12deg); }
  100%{ transform:scale(1) rotate(0); }
}
.result-stats{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:26px; }
.result-stat{
  flex:1 1 0; min-width:96px;
  padding:14px 10px;
  border:2px solid var(--border-color); border-radius:var(--radius);
  background:var(--surface-polar);
}
.result-stat .stat-icon{ font-size:1.5rem; line-height:1; }
.result-stat .stat-value{ font-size:1.35rem; font-weight:900; color:var(--eel); font-variant-numeric:tabular-nums; }
.result-stat .stat-label{ font-size:.68rem; font-weight:900; letter-spacing:1px; text-transform:uppercase; color:var(--wolf); }
.btn-home-result{
  width:100%; padding:15px;
  background:var(--green); color:#fff; border:none;
  border-radius:var(--radius-sm);
  font-family:var(--font); font-size:1rem; font-weight:900;
  letter-spacing:1px; text-transform:uppercase; cursor:pointer;
  box-shadow:0 4px 0 var(--green-d); transition:var(--trans);
}
.btn-home-result:hover{ filter:brightness(1.07); }
.btn-home-result:active{ transform:translateY(4px); box-shadow:none; }

/* ============================================================
   SIN VIDAS
   ============================================================ */
#screen-no-hearts{ justify-content:center; padding:30px 18px 40px; }
.no-hearts-card{
  width:100%; max-width:420px; text-align:center;
  background:var(--surface-card); border:2px solid var(--border-color);
  border-radius:var(--radius-xl);
  padding:34px clamp(20px,5vw,32px) 26px;
  animation:cardPop .5s cubic-bezier(.34,1.56,.64,1);
}
.no-hearts-icon{ width:108px; height:108px; margin:0 auto 10px; }
.no-hearts-title{ font-size:1.6rem; font-weight:900; color:var(--red-d); letter-spacing:-.02em; }
.no-hearts-desc{ color:var(--wolf); font-weight:700; font-size:.95rem; margin:8px 0 24px; line-height:1.55; }
.btn-refill{
  width:100%; padding:15px; margin-bottom:12px;
  background:var(--blue); color:#fff; border:none;
  border-radius:var(--radius-sm);
  font-family:var(--font); font-size:.98rem; font-weight:900;
  letter-spacing:.8px; text-transform:uppercase; cursor:pointer;
  box-shadow:0 4px 0 var(--blue-d); transition:var(--trans);
}
.btn-refill:hover{ filter:brightness(1.07); }
.btn-refill:active{ transform:translateY(4px); box-shadow:none; }
.btn-back-home{
  width:100%; padding:14px;
  background:var(--surface-card); color:var(--wolf);
  border:2px solid var(--border-color); border-bottom-width:4px;
  border-radius:var(--radius-sm);
  font-family:var(--font); font-size:.92rem; font-weight:900;
  letter-spacing:.8px; text-transform:uppercase; cursor:pointer;
  transition:var(--trans);
}
.btn-back-home:hover{ background:var(--polar); color:var(--eel); }

/* ============================================================
   PERFIL
   ============================================================ */
#screen-profile{ padding:28px 0 40px; }
.profile-avatar{
  width:118px; height:118px; margin:0 auto 4px;
  animation:heroFloat 3.4s ease-in-out infinite alternate;
}
@keyframes heroFloat{
  from{ transform:translateY(0) rotate(-2deg); }
  to{ transform:translateY(-10px) rotate(2deg); }
}
.profile-name{ font-size:1.6rem; font-weight:900; text-align:center; color:var(--eel); letter-spacing:-.02em; }
.profile-sub{ text-align:center; color:var(--wolf); font-weight:800; font-size:.86rem; margin-bottom:22px; }
.profile-grid{
  display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
  width:100%; max-width:560px; padding:0 18px; margin-bottom:20px;
}
.profile-stat{
  background:var(--surface-card); border:2px solid var(--border-color); border-radius:var(--radius);
  padding:16px 12px; text-align:center;
  animation:screenIn .4s backwards;
}
.profile-stat:nth-child(1){animation-delay:.02s} .profile-stat:nth-child(2){animation-delay:.06s}
.profile-stat:nth-child(3){animation-delay:.10s} .profile-stat:nth-child(4){animation-delay:.14s}
.profile-stat:nth-child(5){animation-delay:.18s} .profile-stat:nth-child(6){animation-delay:.22s}
.profile-stat .ps-icon{ font-size:1.5rem; line-height:1; }
.profile-stat .ps-val{ font-size:1.4rem; font-weight:900; color:var(--eel); font-variant-numeric:tabular-nums; }
.profile-stat .ps-label{ font-size:.65rem; font-weight:900; letter-spacing:1px; text-transform:uppercase; color:var(--wolf); }
.profile-actions{ width:100%; max-width:560px; padding:0 18px; }
@media (min-width:640px){
  .profile-grid{ grid-template-columns:repeat(3,1fr); }
}

/* ============================================================
   BARRA DE NAVEGACIÓN (bottom bar -> sidebar en escritorio)
   ============================================================ */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:90;
  display:flex; gap:6px;
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));
  background:var(--surface-bar);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border-top:2px solid var(--border-color);
}
.tab{
  flex:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  padding:6px 4px; border:none; background:none; border-radius:14px;
  color:var(--hare); cursor:pointer; font-family:var(--font);
  font-weight:900; font-size:.66rem; letter-spacing:.8px; text-transform:uppercase;
  transition:var(--trans);
}
.tab svg{ width:26px; height:26px; transition:transform .2s; }
.tab:hover{ color:var(--wolf); }
.tab:hover svg{ transform:translateY(-2px) scale(1.06); }
.tab.active{ color:var(--green-d); background:var(--green-lt); }
body.no-chrome .tabbar{ display:none; }
body.no-chrome .stage{ padding-bottom:0; }
body.no-chrome .top-bar{ display:none; }

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay{
  position:fixed; inset:0; z-index:200;
  display:none; align-items:center; justify-content:center;
  padding:22px;
  background:rgba(60,60,60,.5);
  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
}
.modal-overlay.show{ display:flex; animation:fadeIn .2s ease; }
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
.modal-card{
  width:100%; max-width:370px;
  background:var(--surface-card);
  border:2px solid var(--border-color); border-radius:var(--radius-xl);
  padding:26px 22px 20px; text-align:center;
  animation:modalPop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalPop{
  from{ opacity:0; transform:scale(.86) translateY(16px); }
  to{ opacity:1; transform:none; }
}
.modal-mascot{ width:92px; height:92px; margin:0 auto 10px; }
.modal-title{ font-size:1.35rem; font-weight:900; color:var(--eel); letter-spacing:-.02em; }
.modal-text{ color:var(--wolf); font-weight:700; font-size:.9rem; line-height:1.55; margin:8px 0 20px; }
.modal-actions{ display:flex; flex-direction:column; gap:10px; }
.btn-modal{
  width:100%; padding:14px; border:none; border-radius:var(--radius-sm);
  font-family:var(--font); font-size:.94rem; font-weight:900;
  letter-spacing:.8px; text-transform:uppercase; cursor:pointer;
  transition:var(--trans);
}
.btn-modal:active{ transform:translateY(4px); box-shadow:none !important; }
.btn-modal.green{ background:var(--green); color:#fff; box-shadow:0 4px 0 var(--green-d); }
.btn-modal.green:hover{ filter:brightness(1.07); }
.btn-modal.red{ background:var(--red); color:#fff; box-shadow:0 4px 0 var(--red-d); }
.btn-modal.red:hover{ filter:brightness(1.07); }
.btn-modal.ghost{
  background:var(--surface-card); color:var(--wolf);
  border:2px solid var(--border-color); border-bottom-width:4px;
}
.btn-modal.ghost:hover{ background:var(--polar); color:var(--eel); }

/* ============================================================
   MASCOTAS DE HARDWARE
   ============================================================ */
.home-mascot, .mascot, .lesson-mascot, .result-mascot,
.no-hearts-icon, .modal-mascot, .profile-avatar{
  display:flex; align-items:center; justify-content:center;
}
.mascot-svg{ display:block; width:100%; height:100%; overflow:visible; }
.mascot-body{ transform-box:fill-box; transform-origin:center bottom; animation:mascotBreath 3.6s ease-in-out infinite; }
@keyframes mascotBreath{
  0%,100%{ transform:scaleY(1) scaleX(1); }
  45%{ transform:scaleY(1.025) scaleX(0.985); }
  75%{ transform:scaleY(0.99) scaleX(1.008); }
}
.mascot-face{ transform-box:fill-box; transform-origin:center; }
.face-idle{ animation:mascotBlink 4.2s ease-in-out infinite; }
@keyframes mascotBlink{
  0%,88%,100%{ transform:scaleY(1); }
  92%{ transform:scaleY(.06); }
  95%{ transform:scaleY(1); }
  97%{ transform:scaleY(.1); }
}
/* Antenas y adornos con pulso */
.mascot-antenna{ transform-box:fill-box; transform-origin:bottom center; animation:antennaBob 2.1s ease-in-out infinite alternate; }
@keyframes antennaBob{
  from{ transform:rotate(-5deg); }
  to{ transform:rotate(5deg); }
}
/* Luces LED parpadeantes */
.mascot-led{ animation:ledBlink 2.4s ease-in-out infinite; }
.mascot-led.led2{ animation-delay:.8s; }
.mascot-led.led3{ animation-delay:1.5s; }
@keyframes ledBlink{
  0%,45%,100%{ opacity:1; }
  50%,55%{ opacity:.15; }
}
.mascot{ width:100%; max-width:320px; gap:14px; margin:0 auto; align-items:flex-end; justify-content:center; }
.mascot-hero{ width:118px; height:118px; animation:heroFloat 3.2s ease-in-out infinite alternate; }
.mascot-friend{ width:56px; height:56px; opacity:.94; }
.mascot-friend.mf-left{ animation:heroFloat 3.7s ease-in-out infinite alternate-reverse; }
.mascot-friend.mf-right{ animation:heroFloat 2.9s ease-in-out .35s infinite alternate; }
@keyframes heroFloat{
  from{ transform:translateY(0) rotate(-1.5deg); }
  to{ transform:translateY(-10px) rotate(1.5deg); }
}
.lesson-mascot{ width:46px; height:46px; }

.result-mascot{ animation:mascotIn .55s cubic-bezier(.34,1.56,.64,1); }
.no-hearts-icon{ animation:mascotIn .55s cubic-bezier(.34,1.56,.64,1); }
@keyframes mascotIn{
  0%{ opacity:0; transform:scale(.4) rotate(-14deg); }
  70%{ transform:scale(1.1) rotate(6deg); }
  100%{ opacity:1; transform:none; }
}
/* Reacciones */
.mascot-happy{ animation:mascotCelebrate .78s cubic-bezier(.34,1.56,.64,1); }
@keyframes mascotCelebrate{
  0%{ transform:translateY(0) scale(1) rotate(0); }
  22%{ transform:translateY(-26px) scale(1.22) rotate(-10deg); }
  48%{ transform:translateY(0) scale(1) rotate(10deg); }
  70%{ transform:translateY(-10px) scale(1.09) rotate(-4deg); }
  100%{ transform:translateY(0) scale(1) rotate(0); }
}
.mascot-sad{ animation:mascotSob .65s ease; }
@keyframes mascotSob{
  0%,100%{ transform:translateX(0) rotate(0); }
  20%{ transform:translateX(-9px) rotate(-6deg); }
  40%{ transform:translateX(9px) rotate(6deg); }
  60%{ transform:translateX(-6px) rotate(-4deg); }
  80%{ transform:translateX(6px) rotate(3deg); }
}
/* Shake del mascot-top al fallar */
.mascot-top-wrong{ animation:mascotTopWrong .5s cubic-bezier(.36,.07,.19,.97); }
@keyframes mascotTopWrong{
  10%,90%{ transform:translateX(-3px) rotate(-2deg); }
  30%,70%{ transform:translateX(3px) rotate(2deg); }
  50%{ transform:translateX(-2px) rotate(-1deg); }
}

/* ============================================================
   EFECTOS DINÁMICOS
   ============================================================ */
#fx-canvas{
  position:absolute; inset:0; width:100%; height:100%;
  pointer-events:none; z-index:9999;
}
.ripple{
  position:absolute; border-radius:50%;
  background:currentColor; opacity:.22;
  transform:scale(0); pointer-events:none;
  animation:rippleOut .6s ease-out forwards;
}
@keyframes rippleOut{ to{ transform:scale(2.6); opacity:0; } }

.float-pop{
  position:fixed; left:50%; bottom:112px; z-index:500;
  transform:translateX(-50%);
  font-weight:900; font-size:1.35rem; color:var(--green-d);
  text-shadow:0 2px 0 #fff, 0 0 12px rgba(255,255,255,.9);
  pointer-events:none; white-space:nowrap;
  animation:floatUp 1.15s cubic-bezier(.2,.7,.3,1) forwards;
}
.float-pop.combo{ bottom:auto; top:calc(var(--topbar-h) + 12px); font-size:1.5rem; color:var(--orange-d); }
@keyframes floatUp{
  0%{ opacity:0; transform:translate(-50%,14px) scale(.6); }
  22%{ opacity:1; transform:translate(-50%,-8px) scale(1.18); }
  55%{ transform:translate(-50%,-14px) scale(1); }
  100%{ opacity:0; transform:translate(-50%,-70px) scale(.95); }
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:620px){
  .brand{ display:none; }
  .top-stats{ margin:0 auto; }
  .stat-pill{ font-size:1rem; gap:4px; }
  .stat-pill .icon{ font-size:1.12rem; }
  .node{ width:68px; height:68px; font-size:1.6rem; }
  .unit-banner{ padding:13px 16px; }
}
@media (min-width:520px){ :root{ --amp:76px; } }

/* Tablet */
@media (min-width:641px) and (max-width:1023px){
  .path-container{ max-width:600px; }
}

/* Escritorio: barra inferior -> barra lateral estilo Duolingo web */
@media (min-width:1024px){
  .tabbar{
    top:0; bottom:0; right:auto; left:0;
    width:var(--sidebar-w);
    flex-direction:column; justify-content:flex-start; gap:8px;
    padding:calc(var(--topbar-h) + 18px) 16px 20px;
    border-top:none; border-right:2px solid var(--swan);
  }
  .tab{
    flex:none; flex-direction:row; justify-content:flex-start; gap:16px;
    padding:14px 18px; font-size:.8rem; letter-spacing:1.2px;
    border-radius:var(--radius-sm);
  }
  .tab svg{ width:28px; height:28px; }
  .top-bar{ margin-left:var(--sidebar-w); }
  .stage{ margin-left:var(--sidebar-w); padding-bottom:0; }
  body.no-chrome .stage{ margin-left:0; }
  .path-container{ max-width:620px; }
  :root{ --amp:96px; }
  #screen-home{ padding-bottom:60px; }
  .lesson-body{ max-width:700px; }
}

/* ---- Destello de acierto / error ---- */
.screen-flash{ position:fixed; inset:0; z-index:400; pointer-events:none; opacity:0; }
.screen-flash.ok{
  background:radial-gradient(ellipse 60% 55% at 50% 72%, rgba(88,204,2,.42), rgba(88,204,2,0) 70%);
  animation:flashPulse .62s ease-out;
}
.screen-flash.bad{
  background:radial-gradient(ellipse 60% 55% at 50% 72%, rgba(255,75,75,.42), rgba(255,75,75,0) 70%);
  animation:flashPulse .52s ease-out;
}
@keyframes flashPulse{ 0%{opacity:0} 14%{opacity:1} 100%{opacity:0} }

/* ---- Temblor del bloque de pregunta al fallar ---- */
#lesson-body.quake{ animation:quake .42s cubic-bezier(.36,.07,.19,.97); }
@keyframes quake{
  10%,90%{ transform:translateX(-2px); }
  20%,80%{ transform:translateX(3px); }
  30%,50%,70%{ transform:translateX(-6px); }
  40%,60%{ transform:translateX(6px); }
}

/* ---- Corazón que se escapa al perder una vida ---- */
.fly-heart{
  position:fixed; z-index:450; pointer-events:none;
  font-size:1.5rem; line-height:1; color:var(--red);
  animation:flyHeart 1s cubic-bezier(.3,.7,.4,1) forwards;
}
@keyframes flyHeart{
  0%{ opacity:1; transform:translate(0,0) scale(1) rotate(0); }
  100%{ opacity:0; transform:translate(var(--fx,-40px),-96px) scale(.35) rotate(-40deg); }
}

/* ---- Aparición progresiva al hacer scroll ---- */
.subject-block.reveal{ opacity:0; transform:translateY(28px); }
.subject-block.reveal.in{
  opacity:1; transform:none;
  transition:opacity .5s ease, transform .55s cubic-bezier(.2,.85,.3,1);
}

/* ---- Ojos de las mascotas que siguen al cursor ---- */
.mascot-svg .pupil{
  transition:transform .18s ease-out;
  transform:translate(var(--px,0),var(--py,0));
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
  .screen-flash{ display:none; }
  .subject-block.reveal{ opacity:1; transform:none; }
}

/* ============================================================
   DARK MODE — overrides de elementos con colores hardcodeados
   ============================================================ */
@media (prefers-color-scheme: dark) {
  /* Fondos de cards y superficies flotantes */
  .lesson-header,
  .lesson-footer,
  .result-card,
  .no-hearts-card,
  .profile-stat,
  .lesson-close { background:var(--surface-card); }

  .lesson-header{ border-bottom-color:var(--border-color); }
  .lesson-footer{ border-top-color:var(--border-color); }

  /* Opciones de respuesta */
  .mc-answer,
  .fill-word,
  .flying-word,
  .match-item,
  .tf-btn,
  .btn-back-home,
  .btn-modal.ghost {
    background:var(--surface-card);
    border-color:var(--border-color);
    color:var(--eel);
  }
  .mc-answer:hover{ background:var(--polar); }
  .mc-answer.selected{ background:var(--blue-lt); border-color:var(--blue); color:var(--blue-bd); }
  .mc-answer.correct { background:var(--green-lt); border-color:var(--green); color:var(--green-bd); }
  .mc-answer.wrong   { background:var(--red-lt);   border-color:var(--red);   color:var(--red-bd); }

  /* Icono de estado de nodo */
  .node-done-badge{ background:var(--surface-card); border-color:var(--border-color); }

  /* Estadísticas de perfil */
  .result-stat{ background:var(--surface-polar); border-color:var(--border-color); }

  /* Banners de materias — aclarar ligeramente el fondo */
  .unit-banner.aso   { background: linear-gradient(135deg,#0e3d80,#1a6fc0); }
  .unit-banner.red   { background: linear-gradient(135deg,#7a1a00,#c03000); }

// GAME STATE
// ============================================================
const STORAGE_KEY = 'asirlingo-state';
let state = {
  hearts: 5,
  maxHearts: 5,
  xp: 0,
  gems: 10,
  streak: 0,
  lastPlayed: null,
  progress: {}, // { 'lessonId': { completed: bool, stars: 0-3 } }
  expandedUnits: []
};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = { ...state, ...JSON.parse(saved) };
  } catch(e) {}
  // Regenerate hearts if enough time passed
  regenerateHearts();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

function regenerateHearts() {
  const now = Date.now();
  if (state.lastHeartLoss) {
    const elapsed = now - state.lastHeartLoss;
    const regenInterval = 30 * 60 * 1000; // 30 min per heart
    const heartsRegained = Math.floor(elapsed / regenInterval);
    if (heartsRegained > 0 && state.hearts < state.maxHearts) {
      state.hearts = Math.min(state.maxHearts, state.hearts + heartsRegained);
      if (state.hearts >= state.maxHearts) {
        state.lastHeartLoss = null;
      } else {
        state.lastHeartLoss += heartsRegained * regenInterval;
      }
    }
  }
}

function loseHeart() {
  // Unlimited lives: logic disabled
}

function updateStreak() {
  const today = new Date().toDateString();
  if (state.lastPlayed !== today) {
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    if (state.lastPlayed === yesterday) {
      state.streak++;
    } else if (state.lastPlayed !== today) {
      state.streak = 1;
    }
    state.lastPlayed = today;
    saveState();
  }
}

function getLessonProgress(lessonId) {
  return state.progress[lessonId] || { completed: false, stars: 0 };
}

function isLessonUnlocked(subjectIdx, unitIdx, lessonIdx) {
  if (lessonIdx === 0) return true;
  const prevLesson = SUBJECTS[subjectIdx].units[unitIdx].lessons[lessonIdx - 1];
  return getLessonProgress(prevLesson.id).completed;
}

// Ondas del camino: desplazamiento horizontal de cada nodo (zigzag serpenteante)
const WAVE = [0, 0.68, 1, 0.68, 0, -0.68, -1, -0.68];

function renderHome() {
  updateTopBar();
  renderHomeMascot();
  const container = document.getElementById('path-container');
  const revealObs = getRevealObserver();
  container.innerHTML = '';

  SUBJECTS.forEach((subject, sIdx) => {
    const allLessons = subject.units.reduce((acc, u) => acc.concat(u.lessons), []);
    const totalLessons = allLessons.length;
    const doneLessons = allLessons.filter(l => getLessonProgress(l.id).completed).length;
    const pct = totalLessons > 0 ? Math.round((doneLessons / totalLessons) * 100) : 0;

    const section = document.createElement('section');
    section.className = 'subject-block reveal';

    const banner = document.createElement('div');
    banner.className = 'unit-banner ' + subject.color;
    banner.innerHTML =
      '<span class="ub-ico">' + subject.icon + '</span>' +
      '<div class="ub-body">' +
        '<div class="ub-kicker">Materia</div>' +
        '<div class="ub-name">' + subject.name + '</div>' +
        '<div class="ub-meta">' + subject.professor + ' · ' + doneLessons + '/' + totalLessons + ' lecciones</div>' +
      '</div>' +
      '<div class="ub-ring">' + pct + '%</div>';
    section.appendChild(banner);

    const rows = document.createElement('div');
    rows.className = 'path-rows';

    let counter = 0;
    subject.units.forEach((unit, uIdx) => {
      // El primer nodo desbloqueado y sin completar de cada unidad es el "actual"
      let currentIdx = -1;
      unit.lessons.forEach((lesson, lIdx) => {
        if (currentIdx === -1 && isLessonUnlocked(sIdx, uIdx, lIdx) && !getLessonProgress(lesson.id).completed) {
          currentIdx = lIdx;
        }
      });

      unit.lessons.forEach((lesson, lIdx) => {
        const progress = getLessonProgress(lesson.id);
        const completed = progress.completed;
        const unlocked = isLessonUnlocked(sIdx, uIdx, lIdx);
        const isCurrent = lIdx === currentIdx;

        const row = document.createElement('div');
        row.className = 'node-row ' + subject.color + (isCurrent ? ' current' : '');
        row.style.setProperty('--dx', 'calc(var(--amp) * ' + WAVE[counter % WAVE.length] + ')');

        if (isCurrent) {
          const cue = document.createElement('div');
          cue.className = 'node-cue';
          cue.textContent = 'Empezar';
          row.appendChild(cue);
        }

        const btn = document.createElement('button');
        btn.className = 'node' + (completed ? ' completed' : '') + (isCurrent ? ' current' : '') + (unlocked ? '' : ' locked');
        btn.style.setProperty('--d', (counter * 0.05).toFixed(2) + 's');
        btn.setAttribute('aria-label', lesson.name);
        btn.setAttribute('title', lesson.name + ' — ' + lesson.desc);
        btn.innerHTML = '<span class="node-ico">' + (unlocked ? lesson.icon : '🔒') + '</span>' +
                        (completed ? '<span class="node-badge">✓</span>' : '');
        btn.onclick = () => {
          if (unlocked) startLesson(subject.id, unit.id, lesson.id);
          else floatPop('🔒 Termina la lección anterior', { color: '#777777' });
        };
        row.appendChild(btn);

        const n = progress.stars || 0;
        const stars = document.createElement('div');
        stars.className = 'node-stars';
        let starsHtml = '';
        for (let i = 0; i < 3; i++) starsHtml += '<span class="s ' + (i < n ? 'on' : 'off') + '">★</span>';
        stars.innerHTML = starsHtml;
        row.appendChild(stars);

        const label = document.createElement('div');
        label.className = 'node-label';
        label.textContent = lesson.name;
        row.appendChild(label);

        rows.appendChild(row);
        counter++;
      });
    });

    section.appendChild(rows);
    container.appendChild(section);
    if (revealObs) revealObs.observe(section); else section.classList.add('in');
  });
}

/* ---- Efectos: onda al pulsar, textos flotantes ---- */
function spawnRipple(el, ev) {
  if (!el || !el.getBoundingClientRect) return;
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const span = document.createElement('span');
  span.className = 'ripple';
  span.style.width = span.style.height = size + 'px';
  const cx = ev && ev.clientX ? ev.clientX - rect.left : rect.width / 2;
  const cy = ev && ev.clientY ? ev.clientY - rect.top : rect.height / 2;
  span.style.left = (cx - size / 2) + 'px';
  span.style.top = (cy - size / 2) + 'px';
  el.appendChild(span);
  setTimeout(() => span.remove(), 640);
}

function floatPop(text, opts) {
  opts = opts || {};
  const el = document.createElement('div');
  el.className = 'float-pop' + (opts.combo ? ' combo' : '');
  el.textContent = text;
  if (opts.color) el.style.color = opts.color;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1250);
}

/* ---- Efectos: destello, corazón volador, temblor ---- */
function screenFlash(kind) {
  const el = document.createElement('div');
  el.className = 'screen-flash ' + kind;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 660);
}

function flyHeart(fromEl) {
  const el = document.createElement('div');
  el.className = 'fly-heart';
  el.textContent = '\u2764';
  const r = fromEl ? fromEl.getBoundingClientRect()
                   : { left: window.innerWidth - 70, top: 12, width: 20, height: 20 };
  el.style.left = (r.left + r.width / 2 - 11) + 'px';
  el.style.top = (r.top + 2) + 'px';
  el.style.setProperty('--fx', ((Math.random() - 0.5) * 100).toFixed(0) + 'px');
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1060);
}

function quake(el) {
  if (!el) return;
  el.classList.remove('quake');
  void el.offsetWidth;
  el.classList.add('quake');
}

/* ---- Contador animado en la barra superior ---- */
function countUpTo(el, from, to) {
  if (el._raf) cancelAnimationFrame(el._raf);
  if (from === to) { el.textContent = to; return; }
  const dur = 420, t0 = performance.now();
  function step(now) {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (p < 1) el._raf = requestAnimationFrame(step);
  }
  el._raf = requestAnimationFrame(step);
}

let lastPointer = { x: 0, y: 0 };

document.addEventListener('pointerdown', (e) => {
  lastPointer = { x: e.clientX, y: e.clientY };
  const target = e.target && e.target.closest && e.target.closest('.mc-answer, .tf-btn, .fill-word, .match-item');
  if (target) spawnRipple(target, e);
});

/* ---- Los ojos de las mascotas siguen al cursor ---- */
let eyeRaf = null;
// Current interpolated eye position (lerp target)
let eyeTarget = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
let eyeCurrent = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

function updateEyes() {
  // Lerp towards target (smooth follow)
  const lerpF = 0.12;
  eyeCurrent.x += (eyeTarget.x - eyeCurrent.x) * lerpF;
  eyeCurrent.y += (eyeTarget.y - eyeCurrent.y) * lerpF;

  const svgs = document.querySelectorAll('.mascot-svg');
  svgs.forEach((svg) => {
    const r = svg.getBoundingClientRect();
    if (!r.width) return;
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    let dx = eyeCurrent.x - cx;
    let dy = eyeCurrent.y - cy;
    const dist = Math.hypot(dx, dy) || 1;
    // Larger mascots get more travel; small ones less
    const maxTravel = r.width < 60 ? 2.2 : 3.8;
    const k = Math.min(1, dist / 200) * maxTravel;
    svg.style.setProperty('--px', ((dx / dist) * k).toFixed(2) + 'px');
    svg.style.setProperty('--py', ((dy / dist) * k).toFixed(2) + 'px');
  });

  requestAnimationFrame(updateEyes);
}
requestAnimationFrame(updateEyes);

document.addEventListener('pointermove', (e) => {
  lastPointer = { x: e.clientX, y: e.clientY };
  eyeTarget = { x: e.clientX, y: e.clientY };
});

/* ---- Aparición progresiva de bloques al hacer scroll ---- */
let revealObserver = null;
function getRevealObserver() {
  if (!revealObserver && typeof IntersectionObserver !== 'undefined') {
    revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) { en.target.classList.add('in'); revealObserver.unobserve(en.target); }
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.05 });
  }
  return revealObserver;
}

const statCache = { hearts: null, streak: null, xp: null, gems: null };

function updateTopBar() {
  const values = { hearts: state.hearts, streak: state.streak, xp: state.xp, gems: state.gems };
  Object.keys(values).forEach(key => {
    const el = document.getElementById('stat-' + key);
    if (!el) return;
    const changed = statCache[key] !== null && statCache[key] !== values[key];
    if (changed) {
      if (key === 'hearts') el.textContent = '∞';
      else countUpTo(el, statCache[key], values[key]);
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
    } else {
      el.textContent = key === 'hearts' ? '∞' : values[key];
    }
    statCache[key] = values[key];
  });
}

let currentLesson = null;
let currentQuestions = [];
let qIndex = 0;
let failedQuestions = [];
let correctCount = 0;
let wrongCount = 0;
let comboCount = 0;
let lessonFeedback = null;
let selectedAnswer = null;
let pendingAction = null;
let isChecking = false; // Estado para validación diferida

function startLesson(subjectId, unitId, lessonId) {
  // Find lesson
  let lesson = null, subject = null, unit = null;
  for (const s of SUBJECTS) {
    for (const u of s.units) {
      for (const l of u.lessons) {
        if (l.id === lessonId) {
          lesson = l; subject = s; unit = u;
        }
      }
    }
  }
  if (!lesson) return;

  currentLesson = lesson;
  currentQuestions = [...lesson.questions];
  failedQuestions = [];
  // Shuffle questions for replayability
  currentQuestions = shuffleArray(currentQuestions);
  qIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  comboCount = 0;
  // Each lesson gets a random hardware companion
  lessonMascotType = MASCOT_TYPES[Math.floor(Math.random() * MASCOT_TYPES.length)];

  showScreen('screen-lesson');
  updateLessonHeader();
  renderQuestion();
}

function updateLessonHeader() {
  const progress = currentQuestions.length > 0 ? (qIndex / currentQuestions.length) * 100 : 0;
  document.getElementById('lesson-progress-bar').style.width = progress + '%';
  document.getElementById('lesson-hearts-count').textContent = '∞';
}

function getMascotForQuestion(q) {
  const text = (q.prompt + ' ' + (q.subtitle || '')).toLowerCase();
  if (text.includes('red') || text.includes('netplan') || text.includes('puerto') || text.includes('ssh') || text.includes('ip') || text.includes('tcp') || text.includes('udp')) return 'router';
  if (text.includes('servidor') || text.includes('aso') || text.includes('instalación')) return 'server';
  if (text.includes('virtualbox') || text.includes('máquina') || text.includes('vm') || text.includes('monitor')) return 'pc';
  if (text.includes('memoria') || text.includes('ram')) return 'ram';
  if (text.includes('disco') || text.includes('almacenamiento') || text.includes('partición') || text.includes('von neumann')) return 'disk';
  if (text.includes('chip') || text.includes('extensión') || text.includes('pack')) return 'chip';
  return MASCOT_TYPES[Math.floor(Math.random() * MASCOT_TYPES.length)];
}

function renderQuestion() {
  if (qIndex >= currentQuestions.length) {
    // Si hay fallos, los volvemos a preguntar al final
    if (failedQuestions.length > 0) {
      currentQuestions = [...failedQuestions];
      failedQuestions = [];
      qIndex = 0;
      // Opcional: mostrar un mensaje de "Repaso de errores"
      floatPop('¡Repasemos tus errores!', { color: 'var(--orange)' });
    } else {
      finishLesson();
      return;
    }
  }

  const q = currentQuestions[qIndex];
  
  // Asignar mascota dinámica acorde a la pregunta
  lessonMascotType = getMascotForQuestion(q);
  
  const body = document.getElementById('lesson-body');
  body.innerHTML = '';
  selectedAnswer = null;
  pendingAction = null;
  isChecking = false;

  // Mascot at the top of question (estilo Duolingo actual)
  const mascotTop = document.createElement('div');
  mascotTop.className = 'lesson-mascot-top';
  mascotTop.id = 'lesson-mascot-top';
  body.appendChild(mascotTop); 

  const typeLabel = document.createElement('div');
  typeLabel.className = 'q-type-label';
  typeLabel.textContent = getQuestionTypeLabel(q.type);
  body.appendChild(typeLabel);

  const prompt = document.createElement('div');
  prompt.className = 'q-prompt';
  prompt.innerHTML = q.prompt;
  body.appendChild(prompt);

  if (q.subtitle) {
    const sub = document.createElement('div');
    sub.className = 'q-subtitle';
    sub.textContent = q.subtitle;
    body.appendChild(sub);
  }

  if (q.type === 'mc') renderMC(q, body);
  else if (q.type === 'tf') renderTF(q, body);
  else if (q.type === 'fill') renderFill(q, body);
  else if (q.type === 'match') renderMatch(q, body);

  document.getElementById('btn-continue').style.display = 'none';
  document.getElementById('lesson-feedback').classList.remove('show', 'correct', 'wrong');
  resetLessonMascot();

  updateLessonHeader();
}

function getQuestionTypeLabel(type) {
  const labels = {
    'mc': 'Selecciona la respuesta correcta',
    'tf': '¿Verdadero o falso?',
    'fill': 'Completa el espacio',
    'match': 'Empareja las parejas'
  };
  return labels[type] || 'Responde';
}

// ---- Multiple Choice ----
function renderMC(q, body) {
  const div = document.createElement('div');
  div.className = 'mc-answers';

  const letters = ['A', 'B', 'C', 'D', 'E'];
  const order = shuffleIndices(q.options.length);
  const shuffledOptions = order.map(i => q.options[i]);
  const shuffledCorrect = order.indexOf(q.correct);

  shuffledOptions.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'mc-answer';
    btn.innerHTML = `<div class="mc-icon">${letters[i]}</div><span>${opt}</span>`;
    btn.onclick = () => selectMC(btn, i, shuffledCorrect, div);
    div.appendChild(btn);
  });

  body.appendChild(div);
}

function selectMC(btn, idx, correctIdx, container) {
  if (isChecking) return;
  
  // Highlight selected
  container.querySelectorAll('.mc-answer').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  
  selectedAnswer = { type: 'mc', idx, correctIdx, btn, container };
  
  // Corregir inmediatamente en preguntas tipo test (MC)
  setTimeout(() => {
    checkCurrentAnswer();
  }, 150);
}

// ---- True/False ----
function renderTF(q, body) {
  const div = document.createElement('div');
  div.className = 'tf-answers';

  const trueBtn = document.createElement('button');
  trueBtn.className = 'tf-btn tf-true';
  trueBtn.textContent = 'Verdadero';
  trueBtn.onclick = () => selectTF(trueBtn, true, q.correct, div);

  const falseBtn = document.createElement('button');
  falseBtn.className = 'tf-btn tf-false';
  falseBtn.textContent = 'Falso';
  falseBtn.onclick = () => selectTF(falseBtn, false, q.correct, div);

  div.appendChild(trueBtn);
  div.appendChild(falseBtn);
  body.appendChild(div);
}

function selectTF(btn, choice, correct, container) {
  if (isChecking) return;
  
  container.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  
  selectedAnswer = { type: 'tf', choice, correct, btn, container };
  
  // Corregir inmediatamente en Verdadero/Falso
  setTimeout(() => {
    checkCurrentAnswer();
  }, 150);
}

// ---- Fill in the Blank ----
function renderFill(q, body) {
  const container = document.createElement('div');
  container.className = 'fill-input-container';

  const sentence = document.createElement('div');
  sentence.className = 'fill-sentence';
  sentence.innerHTML = q.prompt.replace('___', '<span class="fill-slot" id="fill-slot"></span>');
  container.appendChild(sentence);

  const bank = document.createElement('div');
  bank.className = 'fill-bank';
  const shuffledWords = shuffleArray([...q.words]);
  shuffledWords.forEach((word, i) => {
    const w = document.createElement('button');
    w.className = 'fill-word';
    w.textContent = word;
    w.dataset.word = word;
    w.onclick = () => selectFillWord(w, word, q.words[q.correct], bank);
    bank.appendChild(w);
  });
  container.appendChild(bank);
  body.appendChild(container);
}

function selectFillWord(wordEl, word, correctWord, bank) {
  const slot = document.getElementById('fill-slot');
  if (!slot || wordEl.classList.contains('used')) return;

  // Animation: Create a flying clone
  const rectFrom = wordEl.getBoundingClientRect();
  const rectTo = slot.getBoundingClientRect();

  const flyer = document.createElement('div');
  flyer.className = 'flying-word';
  flyer.textContent = word;
  flyer.style.left = rectFrom.left + 'px';
  flyer.style.top = rectFrom.top + 'px';
  flyer.style.width = rectFrom.width + 'px';
  flyer.style.height = rectFrom.height + 'px';
  document.body.appendChild(flyer);

  wordEl.classList.add('used');

  // Trigger animation
  requestAnimationFrame(() => {
    flyer.style.left = rectTo.left + 'px';
    flyer.style.top = rectTo.top + 'px';
    flyer.style.width = rectTo.width + 'px';
    flyer.style.height = rectTo.height + 'px';
    flyer.style.opacity = '0.8';
    flyer.style.transform = 'scale(0.95)';
  });

  setTimeout(() => {
    flyer.remove();
    
    if (slot.classList.contains('filled')) {
      const oldWord = slot.textContent;
      bank.querySelectorAll('.fill-word.used').forEach(w => {
        if (w.dataset.word === oldWord) w.classList.remove('used');
      });
    }

    slot.textContent = word;
    slot.classList.add('filled');

    selectedAnswer = { type: 'fill', word, correctWord, slot, bank };
    
    const continueBtn = document.getElementById('btn-continue');
    continueBtn.style.display = 'block';
    continueBtn.textContent = 'Comprobar';
    continueBtn.classList.remove('wrong');
    pendingAction = 'check';
  }, 450);
}

// ---- Match Pairs ----
let matchSelected = null;
let matchedCount = 0;
let matchTotal = 0;

function renderMatch(q, body) {
  const container = document.createElement('div');
  container.className = 'match-container';

  const grid = document.createElement('div');
  grid.className = 'match-grid';
  grid.id = 'match-grid';

  const leftItems = q.pairs.map((p, i) => ({ text: p.a, pairId: i, side: 'left' }));
  const rightItems = q.pairs.map((p, i) => ({ text: p.b, pairId: i, side: 'right' }));

  matchTotal = q.pairs.length;
  matchedCount = 0;
  matchSelected = null;

  const shuffledLeft = shuffleArray(leftItems);
  const shuffledRight = shuffleArray(rightItems);

  // Left column
  shuffledLeft.forEach(item => {
    const el = document.createElement('div');
    el.className = 'match-item';
    el.textContent = item.text;
    el.dataset.pairId = item.pairId;
    el.dataset.side = 'left';
    el.onclick = () => selectMatch(el);
    grid.appendChild(el);
  });

  // Right column
  shuffledRight.forEach(item => {
    const el = document.createElement('div');
    el.className = 'match-item';
    el.textContent = item.text;
    el.dataset.pairId = item.pairId;
    el.dataset.side = 'right';
    el.onclick = () => selectMatch(el);
    grid.appendChild(el);
  });

  container.appendChild(grid);
  body.appendChild(container);
}

function selectMatch(el) {
  if (el.classList.contains('matched') || el.classList.contains('disabled')) return;

  if (!matchSelected) {
    matchSelected = el;
    el.classList.add('selected');
  } else {
    // Check if same side
    if (matchSelected.dataset.side === el.dataset.side) {
      matchSelected.classList.remove('selected');
      matchSelected = el;
      el.classList.add('selected');
      return;
    }

    // Check match
    if (matchSelected.dataset.pairId === el.dataset.pairId) {
      matchSelected.classList.remove('selected');
      matchSelected.classList.add('matched');
      el.classList.add('matched');
      matchedCount++;
      matchSelected = null;

      if (matchedCount === matchTotal) {
        setTimeout(() => handleCorrect(), 300);
      }
    } else {
      const wrong1 = matchSelected;
      const wrong2 = el;
      wrong1.classList.remove('selected');
      wrong1.classList.add('wrong');
      wrong2.classList.add('wrong');
      setTimeout(() => {
        wrong1.classList.remove('wrong');
        wrong2.classList.remove('wrong');
      }, 600);
      matchSelected = null;
      // Penalty for wrong match
      handleWrong(true); // partial wrong, don't lose heart yet
    }
  }
}

function checkCurrentAnswer() {
  if (!selectedAnswer || isChecking) return;
  isChecking = true;
  
  const { type } = selectedAnswer;
  
  if (type === 'mc') {
    const { idx, correctIdx, btn, container } = selectedAnswer;
    container.querySelectorAll('.mc-answer').forEach(b => b.classList.add('disabled'));
    const isCorrect = idx === correctIdx;
    if (isCorrect) {
      btn.classList.remove('selected');
      btn.classList.add('correct');
      handleCorrect();
    } else {
      btn.classList.remove('selected');
      btn.classList.add('incorrect');
      container.querySelectorAll('.mc-answer')[correctIdx].classList.add('correct');
      handleWrong();
    }
  } 
  else if (type === 'tf') {
    const { choice, correct, btn, container } = selectedAnswer;
    container.querySelectorAll('.tf-btn').forEach(b => b.style.pointerEvents = 'none');
    const isCorrect = choice === correct;
    if (isCorrect) {
      btn.classList.add('correct');
      handleCorrect();
    } else {
      btn.classList.add('incorrect');
      const otherBtn = container.querySelectorAll('.tf-btn')[choice ? 1 : 0];
      otherBtn.classList.add('correct');
      handleWrong();
    }
  }
  else if (type === 'fill') {
    const { word, correctWord, slot, bank } = selectedAnswer;
    bank.querySelectorAll('.fill-word').forEach(w => w.style.pointerEvents = 'none');
    const isCorrect = word === correctWord;
    if (isCorrect) {
      slot.classList.add('correct');
      handleCorrect();
    } else {
      slot.classList.add('incorrect');
      // Mostrar la palabra correcta visualmente
      bank.querySelectorAll('.fill-word').forEach(w => {
        if (w.dataset.word === correctWord) {
          w.style.borderColor = 'var(--duo-green)';
          w.style.background = 'rgba(88,204,2,.2)';
        }
      });
      handleWrong();
    }
  }
}

// ---- Answer handlers ----
function handleCorrect() {
  correctCount++;
  comboCount++;
  reactMascot('happy');
  showFeedback(true);
  screenFlash('ok');
  const burst = (lastPointer.x || lastPointer.y) ? { x: lastPointer.x, y: lastPointer.y } : {};
  launchConfetti(Object.assign({ count: 22, power: 0.72, radial: true }, burst));
  floatPop('+10 XP');
  if (comboCount === 3 || comboCount % 5 === 0) {
    floatPop('¡Racha x' + comboCount + '!', { combo: true, color: 'var(--orange-d)' });
  }
  document.getElementById('btn-continue').style.display = 'block';
  document.getElementById('btn-continue').textContent = 'Continuar';
  document.getElementById('btn-continue').classList.remove('wrong');
  pendingAction = 'next';
}

function handleWrong(isMatchPartial) {
  if (!isMatchPartial) {
    // Añadir a la cola de fallos para repetir al final
    const currentQ = currentQuestions[qIndex];
    if (!failedQuestions.includes(currentQ)) {
      failedQuestions.push(currentQ);
    }

    wrongCount++;
    comboCount = 0;
    screenFlash('bad');
    quake(document.getElementById('lesson-body'));
    // Hearts are unlimited: flyHeart and loseHeart disabled
    updateLessonHeader();
    const hearts = document.getElementById('lesson-hearts');
    if (hearts) {
      hearts.classList.remove('shake');
      void hearts.offsetWidth;
      hearts.classList.add('shake');
    }
    // Shake the big lesson mascot too
    const mascotTop = document.getElementById('lesson-mascot-top');
    if (mascotTop) {
      mascotTop.classList.remove('mascot-top-wrong');
      void mascotTop.offsetWidth;
      mascotTop.classList.add('mascot-top-wrong');
    }
  }
  reactMascot('sad');
  showFeedback(false);
  document.getElementById('btn-continue').style.display = 'block';
  document.getElementById('btn-continue').textContent = 'Continuar';
  document.getElementById('btn-continue').classList.add('wrong');
  pendingAction = 'next';
}

function showFeedback(isCorrect) {
  const fb = document.getElementById('lesson-feedback');
  const txt = document.getElementById('lesson-feedback-text');
  fb.classList.add('show');
  
  const q = currentQuestions[qIndex];
  let explanationHtml = '';
  if (!isCorrect && q.explanation) {
    explanationHtml = `<div class="feedback-explanation"><strong>Explicación:</strong> ${q.explanation}</div>`;
  }

  if (isCorrect) {
    fb.classList.add('correct');
    fb.classList.remove('wrong');
    const messages = ['¡Excelente!', '¡Perfecto!', '¡Genial!', '¡Muy bien!', '¡Correcto!'];
    txt.innerHTML = `<div>${messages[Math.floor(Math.random() * messages.length)]}</div>`;
  } else {
    fb.classList.add('wrong');
    fb.classList.remove('correct');
    const messages = ['Casi...', 'Incorrecto', '¡Inténtalo de nuevo!', 'No exactamente...'];
    txt.innerHTML = `<div>${messages[Math.floor(Math.random() * messages.length)]}</div>${explanationHtml}`;
  }
}

document.getElementById('btn-continue').onclick = () => {
  if (pendingAction === 'no-hearts') {
    showScreen('screen-no-hearts');
    return;
  }
  if (pendingAction === 'check') {
    checkCurrentAnswer();
    return;
  }
  qIndex++;
  renderQuestion();
};

    }

function abortLesson() {
  currentLesson = null;
  currentQuestions = [];
  qIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  showScreen('screen-home');
  renderHome();
}

// ============================================================
// FINISH LESSON
// ============================================================
function finishLesson() {
  const accuracy = currentQuestions.length > 0 ? Math.round((correctCount / currentQuestions.length) * 100) : 0;
  const stars = accuracy >= 90 ? 3 : accuracy >= 60 ? 2 : 1;
  const xpEarned = correctCount * 10 + (stars === 3 ? 20 : 0);

  // Save progress
  const existing = getLessonProgress(currentLesson.id);
  if (!existing.completed || stars > existing.stars) {
    state.progress[currentLesson.id] = { completed: true, stars: Math.max(stars, existing.stars || 0) };
  }

  state.xp += xpEarned;
  updateStreak();
  saveState();

  // Show result
  const resultMascot = document.getElementById('result-mascot');
  resultMascot.innerHTML = mascotSVG(stars === 3 ? 'chip' : stars === 2 ? 'pc' : 'ram', stars >= 2 ? 'happy' : 'idle');
  resultMascot.classList.remove('mascot-happy');
  void resultMascot.offsetWidth;
  resultMascot.classList.add('mascot-happy');
  document.getElementById('result-title').textContent = stars === 3 ? '¡Perfecto!' : stars === 2 ? '¡Bien hecho!' : '¡Completado!';
  document.getElementById('result-subtitle').textContent = `Has ganado ${xpEarned} XP`;
  document.getElementById('result-xp').textContent = '+' + xpEarned;
  document.getElementById('result-accuracy').textContent = accuracy + '%';
  document.getElementById('result-streak').textContent = state.streak;

  const starsContainer = document.getElementById('result-stars');
  starsContainer.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const star = document.createElement('span');
    star.className = 'result-star' + (i < stars ? ' earned' : '');
    star.textContent = '★';
    starsContainer.appendChild(star);
  }

  showScreen('screen-result');

  if (stars >= 2) {
    launchConfetti();
  }
}

// MASCOTAS DE HARDWARE (SVG)
// ============================================================
const MASCOT_TYPES = ['pc', 'ram', 'chip', 'server', 'router', 'disk'];
let lessonMascotType = 'pc';

function mascotEyes(cx1, cx2, cy, r, pupil) {
  const r2 = r * 0.52;   // pupil radius
  const r3 = r * 0.18;   // shine radius
  return `<g class="mascot-face face-idle">
    <!-- whites -->
    <circle cx="${cx1}" cy="${cy}" r="${r}" fill="#fff"/>
    <circle cx="${cx2}" cy="${cy}" r="${r}" fill="#fff"/>
    <!-- rim shadow -->
    <circle cx="${cx1}" cy="${cy}" r="${r}" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="1.2"/>
    <circle cx="${cx2}" cy="${cy}" r="${r}" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="1.2"/>
    <!-- pupils (follow cursor via CSS --px/--py) -->
    <circle class="pupil" cx="${cx1}" cy="${cy + 1.5}" r="${r2}" fill="${pupil}"/>
    <circle class="pupil" cx="${cx2}" cy="${cy + 1.5}" r="${r2}" fill="${pupil}"/>
    <!-- inner iris highlight -->
    <circle class="pupil" cx="${cx1 + r * 0.12}" cy="${cy + r * 0.05}" r="${r2 * 0.38}" fill="${pupil}" opacity=".5"/>
    <circle class="pupil" cx="${cx2 + r * 0.12}" cy="${cy + r * 0.05}" r="${r2 * 0.38}" fill="${pupil}" opacity=".5"/>
    <!-- shine -->
    <circle class="pupil" cx="${cx1 - r * 0.28}" cy="${cy - r * 0.22}" r="${r3}" fill="#fff" opacity=".92"/>
    <circle class="pupil" cx="${cx2 - r * 0.28}" cy="${cy - r * 0.22}" r="${r3}" fill="#fff" opacity=".92"/>
    <!-- tiny lower shine -->
    <circle class="pupil" cx="${cx1 + r * 0.2}" cy="${cy + r * 0.32}" r="${r3 * 0.5}" fill="#fff" opacity=".55"/>
    <circle class="pupil" cx="${cx2 + r * 0.2}" cy="${cy + r * 0.32}" r="${r3 * 0.5}" fill="#fff" opacity=".55"/>
  </g>`;
}

function mascotBrows(cx1, cx2, cy, color, mood) {
  if (mood === 'happy') {
    // arched up
    return `<g stroke="${color}" stroke-width="2.8" stroke-linecap="round" fill="none">
      <path d="M${cx1-9} ${cy+1} Q${cx1-1} ${cy-8} ${cx1+8} ${cy+1}"/>
      <path d="M${cx2-8} ${cy+1} Q${cx2+1} ${cy-8} ${cx2+9} ${cy+1}"/>
    </g>`;
  }
  // sad / worried — inner ends dip down
  return `<g stroke="${color}" stroke-width="2.8" stroke-linecap="round">
    <line x1="${cx1 - 9}" y1="${cy - 2}" x2="${cx1 + 8}" y2="${cy + 4}"/>
    <line x1="${cx2 + 9}" y1="${cy - 2}" x2="${cx2 - 8}" y2="${cy + 4}"/>
  </g>`;
}

function mascotMouth(mood, cx, cy, color) {
  if (mood === 'happy') {
    // wide smile with teeth hint
    return `<g>
      <path d="M${cx-13} ${cy-2} Q${cx} ${cy+13} ${cx+13} ${cy-2}" stroke="${color}" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <path d="M${cx-9} ${cy+1} Q${cx} ${cy+12} ${cx+9} ${cy+1}" fill="rgba(255,255,255,.28)"/>
    </g>`;
  }
  if (mood === 'sad') {
    return `<path d="M${cx-10} ${cy+6} Q${cx} ${cy-5} ${cx+10} ${cy+6}" stroke="${color}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  }
  // idle — gentle smile
  return `<path d="M${cx-10} ${cy+1} Q${cx} ${cy+9} ${cx+10} ${cy+1}" stroke="${color}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;
}

function mascotSVG(type, mood) {
  mood = mood || 'idle';
  let body = '';

  // ── RAM ──────────────────────────────────────────────────────────────────
  if (type === 'ram') {
    const pcb     = mood === 'sad' ? '#3e7015' : '#4a9200';
    const pcbLt   = mood === 'sad' ? '#5aa020' : '#6cc410';
    const face    = mood === 'sad' ? '#0f2405' : '#0d2204';
    // gold contact pins bottom
    let pins = '';
    for (let i = 0; i < 8; i++) {
      pins += `<rect x="${14 + i*12}" y="88" width="7" height="12" rx="2.5" fill="#e8b800"/>`;
      pins += `<rect x="${14 + i*12}" y="88" width="7" height="4" rx="1" fill="#ffd700" opacity=".6"/>`;
    }
    // notch
    const notch = `<rect x="55" y="88" width="10" height="6" rx="2" fill="${pcb}"/>`;
    // side edge connectors
    const edgeL = `<rect x="4" y="28" width="6" height="62" rx="3" fill="#2a5c08"/>`;
    const edgeR = `<rect x="110" y="28" width="6" height="62" rx="3" fill="#2a5c08"/>`;
    // PCB board
    const board = `
      <rect x="8" y="22" width="104" height="68" rx="11" fill="${pcb}"/>
      <rect x="10" y="24" width="100" height="64" rx="9" fill="${pcbLt}"/>
      <!-- PCB trace lines -->
      <line x1="8" y1="50" x2="112" y2="50" stroke="#3a7012" stroke-width="1" opacity=".5"/>
      <line x1="8" y1="60" x2="112" y2="60" stroke="#3a7012" stroke-width="1" opacity=".5"/>`;
    // memory chips on top half
    const chips = `
      <g>
        <rect x="16" y="28" width="18" height="13" rx="3" fill="#1a3808" opacity=".85"/>
        <rect x="38" y="28" width="18" height="13" rx="3" fill="#1a3808" opacity=".85"/>
        <rect x="60" y="28" width="18" height="13" rx="3" fill="#1a3808" opacity=".85"/>
        <rect x="82" y="28" width="18" height="13" rx="3" fill="#1a3808" opacity=".85"/>
        <!-- chip shine -->
        <rect x="17" y="29" width="8" height="3" rx="1" fill="#fff" opacity=".12"/>
        <rect x="39" y="29" width="8" height="3" rx="1" fill="#fff" opacity=".12"/>
        <rect x="61" y="29" width="8" height="3" rx="1" fill="#fff" opacity=".12"/>
        <rect x="83" y="29" width="8" height="3" rx="1" fill="#fff" opacity=".12"/>
      </g>`;
    // sticker label
    const label = `
      <rect x="20" y="47" width="80" height="20" rx="5" fill="#fff" opacity=".15"/>
      <text x="60" y="61" text-anchor="middle" font-size="7" font-family="monospace" fill="#c8ffa0" opacity=".9">DDR5 16GB</text>`;
    body = `
      <g class="mascot-body">
        ${edgeL}${edgeR}
        ${board}
        ${chips}
        ${label}

function renderProfile() {

  SUBJECTS.forEach(subject => {
